    track('decision_card_create',{format:'png',safe_fields:'product_reasons'});
  }

  function wrapText(ctx,text,x,y,maxWidth,lineHeight) {
    const words=String(text).split(' '); let line='';
    for (const word of words) { const test=line+word+' '; if(ctx.measureText(test).width>maxWidth && line){ctx.fillText(line,x,y);line=word+' ';y+=lineHeight;}else line=test; } ctx.fillText(line,x,y);
  }

  function exportJson() {
    const payload={version:3,format:'allyoung-decision-library',data_mode:DATA_MODE,exported_at:new Date().toISOString(),decisions:state.decisions};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='allyoung-decisions-alpha.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  const bytesToBase64 = (bytes) => {
    let text='';
    for (let i=0;i<bytes.length;i+=0x8000) text += String.fromCharCode(...bytes.subarray(i,i+0x8000));
    return btoa(text);
  };
  const base64ToBytes = (text) => Uint8Array.from(atob(text), (character) => character.charCodeAt(0));

  async function backupKey(passphrase, salt, usages) {
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:BACKUP_KDF_ITERATIONS,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,usages);
  }

  function decisionBackupPayload() {
    return {version:3,format:'allyoung-decision-library',data_mode:DATA_MODE,exported_at:new Date().toISOString(),decisions:state.decisions};
  }

  async function exportEncryptedBackup() {
    const passphrase=String(document.querySelector('#backup-passphrase')?.value || '');
    const confirmation=String(document.querySelector('#backup-passphrase-confirmation')?.value || '');
    if (passphrase.length < 12) { toast('암호는 12자 이상으로 만들어 주세요.'); return; }
    if (passphrase !== confirmation) { toast('두 암호가 같지 않아요. 기존 기록은 그대로예요.'); return; }
    if (!crypto?.subtle) { toast('이 브라우저에서는 암호화 백업을 만들 수 없어요. JSON 내보내기를 이용해 주세요.'); return; }
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await backupKey(passphrase,salt,['encrypt']);
    const clear=new TextEncoder().encode(JSON.stringify(decisionBackupPayload()));
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,clear);
    const payload={version:1,format:ENCRYPTED_BACKUP_FORMAT,created_at:new Date().toISOString(),kdf:{name:'PBKDF2',hash:'SHA-256',iterations:BACKUP_KDF_ITERATIONS,salt:bytesToBase64(salt)},cipher:{name:'AES-GCM',iv:bytesToBase64(iv)},payload:bytesToBase64(new Uint8Array(encrypted))};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='allyoung-decisions-encrypted.aysbackup'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    document.querySelector('#backup-passphrase').value='';document.querySelector('#backup-passphrase-confirmation').value='';
    toast('암호화 백업 파일을 만들었어요. 암호는 이 기기에 저장하지 않으니 따로 안전하게 보관해 주세요.');
  }

  function validDecisionImport(payload) {
    if (!payload || ![1,2,3].includes(Number(payload.version)) || !Array.isArray(payload.decisions)) return false;
    return payload.decisions.every((decision) => decision && typeof decision === 'object' && typeof decision.id === 'string' && typeof decision.product_id === 'string' && typeof decision.name === 'string' && typeof decision.brand === 'string' && Array.isArray(decision.reasons) && decision.reasons.length > 0);
  }

  function validEncryptedBackup(payload) {
    return Boolean(payload && payload.version===1 && payload.format===ENCRYPTED_BACKUP_FORMAT && payload.kdf?.name==='PBKDF2' && payload.kdf?.hash==='SHA-256' && Number(payload.kdf?.iterations)===BACKUP_KDF_ITERATIONS && typeof payload.kdf?.salt==='string' && payload.cipher?.name==='AES-GCM' && typeof payload.cipher?.iv==='string' && typeof payload.payload==='string');
  }

  function applyImportedDecisions(payload) {
    if (!validDecisionImport(payload)) throw new Error('invalid-import');
    const imported=payload.decisions.slice(0,20).map(hydrateDecisionRetention);
    state.decisions=imported;storageReadOnly=false;storageIssue='';safeWrite(STORAGE_KEY,state.decisions);render();
  }

  async function importEncryptedBackup() {
    const file=document.querySelector('#encrypted-import-file')?.files?.[0];
    const passphrase=String(document.querySelector('#encrypted-import-passphrase')?.value || '');
    if (!file) { toast('먼저 암호화 백업 파일을 골라 주세요.'); return; }
    if (!passphrase) { toast('백업을 만든 암호를 입력해 주세요.'); return; }
    if (!crypto?.subtle) { toast('이 브라우저에서는 암호화 백업을 읽을 수 없어요.'); return; }
    try {
      const backup=JSON.parse(await file.text());
      if (!validEncryptedBackup(backup)) throw new Error('invalid-backup');
      const key=await backupKey(passphrase,base64ToBytes(backup.kdf.salt),['decrypt']);
      const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64ToBytes(backup.cipher.iv)},key,base64ToBytes(backup.payload));
      const imported=JSON.parse(new TextDecoder().decode(clear));
      applyImportedDecisions(imported);
      toast('암호화 백업을 가져왔어요. 이 기기의 기존 기록은 새 파일이 검증된 뒤에만 바뀝니다.');
    } catch { toast('암호 또는 백업 파일이 맞지 않아 기존 기록을 그대로 유지했어요.'); }
    const passphraseInput=document.querySelector('#encrypted-import-passphrase'); if (passphraseInput) passphraseInput.value='';
  }

  function isPcKeyboardViewport() {
    return matchMedia('(min-width:1024px)').matches;
  }

  function focusPcCandidate(nextIndex) {
    const cards=[...document.querySelectorAll('[data-candidate]')];
    if(!cards.length)return;
    state.pcCandidateIndex=(nextIndex+cards.length)%cards.length;
    cards.forEach((card,index)=>{
      const active=index===state.pcCandidateIndex;
      card.classList.toggle('keyboard-active',active);
      card.tabIndex=active?0:-1;
      card.setAttribute('aria-current',String(active));
    });
    cards[state.pcCandidateIndex].focus({preventScroll:true});
  }

  async function handlePcKeyboard(event) {
    if(!isPcKeyboardViewport()||!document.querySelector('#candidate-list')||event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
    if(event.target.closest('button,input,select,textarea,a'))return;
    if(event.key==='ArrowRight'){event.preventDefault();focusPcCandidate(state.pcCandidateIndex+1);return;}
    if(event.key==='ArrowLeft'){event.preventDefault();focusPcCandidate(state.pcCandidateIndex-1);return;}
    if(event.key===' '||event.key==='Enter'){
      event.preventDefault();
      const product=state.candidates[state.pcCandidateIndex];
      if(product)await saveDecision(product);
    }
  }

  document.addEventListener('click',async(event) => {
    const button=event.target.closest('button,[data-answer],[data-purpose],[data-usage-start],[data-usage-filter]'); if(!button) return;
    const action=button.dataset.action;
    if(button.dataset.answer){await answerQuiz(button.dataset.answer);return;}
    if(button.dataset.purpose){state.purpose=button.dataset.purpose;track('alternative_select',{purpose:state.purpose,rank:0});await loadAlternatives();return;}
    if(button.dataset.homeConcern){state.answers={concern:button.dataset.homeConcern,skin:button.dataset.homeSkin||'unknown',avoid:'none',budget:'999999',texture:'unknown'};track('decision_start',{entry_path:'home_concern'});await loadCandidates('home_concern');return;}
    if(button.dataset.usageFilter){state.usageFilter=button.dataset.usageFilter;track('usage_search',{kind:'filter',value:state.usageFilter});render();return;}
    if(button.dataset.libraryFilter){state.libraryFilter=button.dataset.libraryFilter;render();return;}
    if(button.dataset.usageStart){
      const start=button.dataset.usageStart; state.usageQuery=''; state.usageFilter='all';
      if(start==='discomfort'){state.selectedUsage='do-not-endure-stinging';state.route='usage-detail';track('usage_card_open',{source:'start',slug:state.selectedUsage});}
      else {state.usageFilter=start==='combine'?'all':start;state.usageQuery=start==='combine'?'같이':'';track('usage_search',{kind:'start',value:start});}
      render();return;
    }
    if(action==='home'||action==='service-home'){state.route='home';render();}
    else if(action==='method'){state.route='method';render();}
    else if(action==='privacy'){state.route='privacy';render();}
    else if(action==='offline-help'){state.route='offline-help';render();}
    else if(action==='connection-notice-close'){state.connectionRecovered=false;render();}
    else if(action==='privacy-sync-toggle'){state.syncConsent=!state.syncConsent;safeWrite(SYNC_CONSENT_KEY,state.syncConsent);render();toast(state.syncConsent ? '선택 동기화를 켰어요. 서버가 연결된 경우에만 이후 기록을 보낼 수 있어요.' : '선택 동기화를 껐어요. 이후 기록은 이 기기에만 저장해요.');}
    else if(action==='toggle-development-dashboard'){state.devDashboardOpen=!state.devDashboardOpen;render();document.querySelector('[data-action="toggle-development-dashboard"]')?.focus();}
    else if(action==='pc-shortcuts'||action==='pc-shortcuts-open'){state.pcHelpOpen=true;render();document.querySelector('[data-pc-shortcut-panel] button')?.focus();}
    else if(action==='pc-shortcuts-close'){state.pcHelpOpen=false;render();document.querySelector('[data-action="pc-shortcuts"]')?.focus();}
    else if(action==='start-quiz'||action==='pc-start-quiz'||action==='restart'){state.route='quiz';state.quizStep=0;state.answers={};state.recalculateNotice=false;track('decision_start',{entry_path:'concern'});render();}
    else if(action==='quiz-back'){state.quizStep=Math.max(0,state.quizStep-1);render();}
    else if(action==='why'){const box=document.querySelector('#why-text');box.hidden=!box.hidden;button.setAttribute('aria-expanded',String(!box.hidden));}
    else if(action==='candidate-filter'){state.candidateFilters[button.dataset.filterKind]=button.dataset.filterValue;render();}
    else if(action==='reset-candidate-filters'){state.candidateFilters={concern:'all',texture:'all',budget:'all'};render();}
    else if(action==='bridge'||action==='pc-bridge'||action==='service-bridge'){state.bridgeMode='existing_product';state.route='bridge';track('decision_start',{entry_path:'existing_product'});render();}
    else if(action==='barcode'){state.bridgeMode='barcode';state.route='barcode';track('decision_start',{entry_path:'barcode'});render();}
    else if(action==='ranking'||action==='pc-ranking'){
      if(state.candidates.length){
        state.candidateFilters={concern:'all',texture:'all',budget:'all'};
        state.route='compare';
        track('compare_open',{candidate_count:state.candidates.length,source:'existing_candidates'});
        render();
      } else {
        state.answers={concern:'moisture',skin:'unknown',avoid:'none',budget:'999999',texture:'unknown'};
        track('decision_start',{entry_path:'ranking'});
        await loadCandidates('ranking');
      }
    }
    else if(action==='usage'||action==='pc-usage'){state.route='usage';state.selectedUsage=null;state.usageBack='usage';state.usageContextProductId=null;track('usage_open',{source:'home'});render();}
    else if(action==='usage-open'){state.selectedUsage=button.dataset.usageSlug;state.usageBack='usage';state.usageContextProductId=null;state.route='usage-detail';track('usage_card_open',{source:'hub',slug:state.selectedUsage});render();}
    else if(action==='usage-back'){state.route=state.usageBack||'usage';state.usageContextProductId=null;render();}
    else if(action==='product-usage'){
      const product=state.candidates.find((item)=>item.id===button.dataset.product)||products.find((item)=>item.id===button.dataset.product)||state.selected;
      const usage=usageCardForProduct(product);if(!usage)return;
      state.selectedUsage=usage.slug;state.usageContextProductId=product.id;state.usageBack=state.route;state.route='usage-detail';track('usage_card_open',{source:'product',slug:usage.slug});render();
    }
    else if(action==='decision-usage'){
      const decision=state.decisions.find((item)=>item.id===button.dataset.decision);const usage=decisionUsage(decision);if(!decision||!usage)return;
      state.selectedUsage=usage.slug;state.usageContextProductId=decision.product_id;state.usageBack=state.route;state.route='usage-detail';track('usage_card_open',{source:'decision',slug:usage.slug});render();
    }
    else if(action==='decision-guide'){state.guideDecisionId=button.dataset.decision;state.route='decision-guide';render();}
    else if(action==='candidates'){state.route='candidates';render();}
    else if(action==='compare'){state.route='compare';track('compare_open',{candidate_count:state.candidates.length});render();}
    else if(action==='alternatives'){state.baseProduct=state.candidates.find((p)=>p.id===button.dataset.product)||products.find((p)=>p.id===button.dataset.product);state.purpose='cheaper';await loadAlternatives();}
    else if(action==='select'){const p=state.candidates.find((item)=>item.id===button.dataset.product)||state.alternatives.find((item)=>item.id===button.dataset.product)||products.find((item)=>item.id===button.dataset.product);if(p)await saveDecision({...p,role:state.candidates.find((c)=>c.id===p.id)?.role||p.role,reasons:state.candidates.find((c)=>c.id===p.id)?.reasons||p.reasons});}
    else if(action==='choose-bridge'){state.bridgeMatch=state.bridgeMatches[Number(button.dataset.bridgeIndex)];document.querySelector('#bridge-result').innerHTML=bridgeMatchCard(state.bridgeMatch);}
    else if(action==='bridge-candidates'){state.answers={concern:state.bridgeMatch.concern,skin:'unknown',avoid:'none',budget:String(state.bridgeMatch.priceBand),texture:state.bridgeMatch.texture==='젤'?'light':'rich'};await loadCandidates(state.bridgeMode||'existing_product');}
    else if(action==='library'||action==='pc-library'){await loadLibrary();}
    else if(action==='retention-review'){state.reviewDecisionId=button.dataset.decision;state.route='retention-review';render();}
    else if(action==='retention-preference'){
      const decision=state.decisions.find((item)=>item.id===button.dataset.decision);if(!decision?.follow_up)return;
      const next={...decision,follow_up:retentionCore.setPreference(decision.follow_up,button.dataset.preference)};replaceDecision(next);render();
      if(API_BASE && state.syncConsent && state.online){try{await retentionApi.preference(next.id,button.dataset.preference);}catch{toast('서버 알림 설정을 바꾸지 못했지만 기기 설정은 유지돼요.');}}
    }
    else if(action==='card'){state.route='card';render();}
    else if(action==='create-vote-card') createVoteShare();
    else if(action==='copy-share-link'){try{await navigator.clipboard.writeText(state.shareLink);toast('친구 카드 링크를 복사했어요.');}catch{toast('링크를 복사하지 못했어요. 입력칸에서 직접 복사해 주세요.');}}
    else if(action==='open-share-demo'){location.hash=`share=${encodeShare(state.sharePayload)}`;loadSharedCardFromHash();render();}
    else if(action==='friend-vote'){state.friendVote=button.dataset.product;const votes=safeRead(SHARE_VOTE_KEY,{});votes[shareKey(state.sharePayload)]=state.friendVote;safeWrite(SHARE_VOTE_KEY,votes);track('decision_card_vote',{choice:state.friendVote,source:'local_demo'});render();}
    else if(action==='friend-recalculate'){history.replaceState(null,'',location.pathname);state.answers={};state.quizStep=0;state.recalculateNotice=true;state.route='quiz';track('decision_card_recalculate',{source:'shared_card',profile_inherited:false});render();}
    else if(action==='share') shareCurrent();
    else if(action==='download-card') downloadCard();
    else if(action==='export') exportJson();
    else if(action==='encrypted-export') await exportEncryptedBackup();
    else if(action==='encrypted-import') await importEncryptedBackup();
    else if(action==='install'){if(deferredInstall){deferredInstall.prompt();}else toast(C.installHttps);}
  });

  document.addEventListener('submit',async(event) => {
    if(event.target.id==='library-search-form'){
      event.preventDefault();state.libraryQuery=String(new FormData(event.target).get('query')||'').trim();render();return;
    }
    if(event.target.dataset.decisionMetadataForm){
      event.preventDefault();const decision=state.decisions.find((item)=>item.id===event.target.dataset.decisionMetadataForm);if(!decision)return;
      const form=new FormData(event.target);const metadata={...decision.metadata,usage_period:String(form.get('usage_period')||'not_started'),repurchase:String(form.get('repurchase')||'undecided')};
      replaceDecision({...decision,metadata});render();toast('사용·재구매 기록을 이 기기에 저장했어요.');return;
    }
    if(event.target.id==='retention-form'){
      event.preventDefault();
      const form=new FormData(event.target);const reasons=form.getAll('reason').map(String);
      if(reasons.length<1||reasons.length>3){toast('이유를 1개에서 3개까지 골라주세요.');return;}
      const decision=state.decisions.find((item)=>item.id===event.target.dataset.decision);if(!decision?.follow_up)return;
      const input={decision_id:decision.id,outcome:String(form.get('outcome')||''),reason_codes:reasons,would_choose_again:form.get('choose_again')==='true',client_op_id:`feedback-${Date.now()}`};
      const local=retentionCore.submitFeedback(decision.follow_up,input);
      if(!local.ok){toast(local.reason==='too_early'?'7일 뒤부터 회고할 수 있어요.':'선택 항목을 다시 확인해 주세요.');return;}
      replaceDecision({...decision,follow_up:local.follow_up});state.route='library';render();toast(local.timing==='late'?'늦은 회고를 구분해 보존했어요.':'회고를 저장했어요.');
      if(API_BASE && state.syncConsent && state.online){try{await retentionApi.feedback(input);}catch{toast('서버 회고 연결은 실패했지만 기기 회고는 유지돼요.');}}
      return;
    }
    if(event.target.id==='usage-search-form'){
      event.preventDefault();state.usageQuery=document.querySelector('#usage-search').value.trim();track('usage_search',{kind:'text',length:state.usageQuery.length});render();return;
    }
    if(event.target.id==='pc-home-search'||event.target.id==='global-search-form'){
      event.preventDefault();const inputId=event.target.id==='global-search-form'?'#global-search-input':'#pc-home-search-input';const rawQuery=document.querySelector(inputId).value.trim();const query=normalizeSearchQuery(rawQuery);if(!query){toast('제품명이나 브랜드, 고민을 입력해 주세요.');return;}
      const result=await decisionApi.bridge(query);state.bridgeMatches=result.matches||[];state.bridgeMatch=state.bridgeMatches.length===1?state.bridgeMatches[0]:null;state.route='bridge';track('decision_start',{entry_path:'home_search'});track('bridge_submit',{input_type:/^\d+$/.test(query)?'gtin':'name',matched:state.bridgeMatches.length>0,confidence:result.match_state==='exact'?'high':result.match_state==='zero'?'low':'mid'});render();document.querySelector('#bridge-query').value=query;document.querySelector('#bridge-result').innerHTML=bridgeResult(result);return;
    }
    if(event.target.id!=='bridge-form')return; event.preventDefault();
    const query=normalizeSearchQuery(document.querySelector('#bridge-query').value);
    const result=await decisionApi.bridge(query);
    state.bridgeMatches=result.matches||[]; state.bridgeMatch=state.bridgeMatches.length===1?state.bridgeMatches[0]:null;
    track('bridge_submit',{input_type:/^\d+$/.test(query)?'gtin':'name',matched:state.bridgeMatches.length>0,confidence:result.match_state==='exact'?'high':result.match_state==='zero'?'low':'mid'});
    document.querySelector('#bridge-result').innerHTML=bridgeResult(result);
  });

  document.addEventListener('change',async(event) => {
    if(event.target.id==='market-context'){
      state.market=MARKET_CONTEXTS[event.target.value] ? event.target.value : 'KR';
      safeWrite('ays-alpha-market-v01',state.market);

  document.addEventListener('keydown',(event)=>{
    if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.target.closest('input,textarea,select')){event.preventDefault();document.querySelector('#global-search-input')?.focus();}

    else if(event.key==='Escape'&&state.devDashboardOpen){state.devDashboardOpen=false;render();document.querySelector('[data-action="toggle-development-dashboard"]')?.focus();}
  });

  window.addEventListener('online',()=>setConnectionState(true));
  window.addEventListener('offline',()=>setConnectionState(false));
  window.addEventListener('beforeinstallprompt',(event)=>{event.preventDefault();deferredInstall=event;render();});
  window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('올영스캐너를 설치했어요.');render();});
  window.addEventListener('hashchange',()=>{if(location.hash==='#progress'){state.devDashboardOpen=true;render();return;}if(loadSharedCardFromHash())render();});

  initStorage(); loadSharedCardFromHash(); setupManifest(); render();
})();
