      'calming gel':'테스트 기존 진정젤', 'soothing gel':'테스트 기존 진정젤', 'light lotion':'테스트 기존 수분크림 라이트',
    };
    return aliases[query] || value.trim();
  }

  function toast(message) {
    const node = document.querySelector('#toast');
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => node.classList.remove('show'), 2400);
  }

  function connectionBar() {
    if (state.online && !state.connectionRecovered) return '';
    if (!state.online) return `<section class="connection-bar offline" data-connection-status="offline" aria-live="polite"><strong>지금 오프라인이에요</strong><span>이 기기에 저장된 후보·결정·암호화 백업은 계속 쓸 수 있어요. 실제 판매처 정보와 선택 동기화는 연결 뒤에만 확인합니다.</span><button data-action="offline-help">오프라인에서 되는 일</button></section>`;
    return `<section class="connection-bar restored" data-connection-status="restored" aria-live="polite"><strong>연결이 돌아왔어요</strong><span>기록은 자동으로 밖으로 보내지지 않아요. 동기화는 직접 켠 경우에만 다시 사용할 수 있어요.</span><button data-action="connection-notice-close">확인</button></section>`;
  }

  function setConnectionState(online) {
    const wasOffline=!state.online;
    state.online=online;
    if (!online) { state.offlineSince=new Date().toISOString();state.connectionRecovered=false;toast('오프라인으로 바뀌었어요. 기기 안의 비교와 기록으로 계속할 수 있어요.'); }
    else if (wasOffline) { state.offlineSince=null;state.connectionRecovered=true;toast('연결이 돌아왔어요. 기록은 자동으로 밖으로 보내지지 않아요.'); }
    render();
  }

  function safeRead(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (error) {
      storageMode = 'memory';
      if (error instanceof SyntaxError) { storageReadOnly=true;storageIssue='corrupt'; }
      return memory.has(key) ? memory.get(key) : fallback;
    }
  }

  function safeWrite(key, value) {
    memory.set(key, value);
    if (storageReadOnly) { storageMode='memory';toast('읽지 못한 기존 저장 기록을 덮지 않고 메모리에 유지해요. JSON 가져오기로 복구할 수 있어요.');return false; }
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      storageMode = 'memory';
      track('storage_fallback', { layer:'local_storage', recovered:true }, false);
      toast(C.storageRecovered);
      return false;
    }
  }

  function normalizeLegacyDecision(decision, index) {
    const selectedAt = typeof decision?.selected_at === 'string' && !Number.isNaN(Date.parse(decision.selected_at)) ? decision.selected_at : (typeof decision?.created_at === 'string' && !Number.isNaN(Date.parse(decision.created_at)) ? decision.created_at : new Date(0).toISOString());
    const reasons = Array.isArray(decision?.reasons) && decision.reasons.filter((item) => typeof item === 'string' && item.trim()).length ? decision.reasons.filter((item) => typeof item === 'string' && item.trim()) : (typeof decision?.reason === 'string' && decision.reason.trim() ? [decision.reason.trim()] : ['이전 판에서 저장한 선택입니다.']);
    const metadata = { concern:decision?.metadata?.concern || decision?.concern || '', usage_period:decision?.metadata?.usage_period || 'not_started', repurchase:decision?.metadata?.repurchase || 'undecided' };
    return {
      ...decision,
      id:typeof decision?.id === 'string' && decision.id ? decision.id : `legacy-${index}-${selectedAt}`,
      product_id:typeof decision?.product_id === 'string' && decision.product_id ? decision.product_id : `legacy-product-${index}`,
      name:typeof decision?.name === 'string' && decision.name ? decision.name : '이전 기록',
      brand:typeof decision?.brand === 'string' && decision.brand ? decision.brand : '브랜드 미확인',
      reasons,
      selected_at:selectedAt,
      metadata,
      compatibility_version:LOCAL_SCHEMA_VERSION,
    };
  }

  function migrateStoredDecisions(stored) {
    const normalized = stored.map(normalizeLegacyDecision).map(hydrateDecisionRetention);
    return { normalized, changed:JSON.stringify(stored) !== JSON.stringify(normalized) };
  }

  function preserveCompatibilityBackup(stored) {
    try {
      if (!localStorage.getItem(LOCAL_COMPAT_BACKUP_KEY)) localStorage.setItem(LOCAL_COMPAT_BACKUP_KEY, JSON.stringify(stored));
    } catch { storageMode='memory'; }
  }

  function track(name, props = {}, persist = true) {
    if (!allowedEvents.has(name)) throw new Error(`unregistered event: ${name}`);
    const safeProps = {};
    const allowed = new Set(['entry_path','data_mode','step','answered','count','shortage_reason','confidence_mix','candidate_count','field','input_type','matched','confidence','purpose','rank','action','elapsed_bucket','format','safe_fields','choice','source','profile_inherited','layer','recovered']);
    for (const [key, value] of Object.entries(props)) if (allowed.has(key)) safeProps[key] = value;
    if (name === 'decision_start') safeProps.data_mode = DATA_MODE;
    state.events.push({ name, props:safeProps, at:new Date().toISOString(), data_mode:DATA_MODE });
    if (persist) safeWrite(EVENT_KEY, state.events.slice(-100));
  }

  function initStorage() {
    try {
      const key = '__ays_probe__';
      localStorage.setItem(key, '1');
      localStorage.removeItem(key);
    } catch { storageMode = 'memory'; }
    const storedDecisions = safeRead(STORAGE_KEY, []);
    if (!Array.isArray(storedDecisions)) { storageMode='memory';storageReadOnly=true;storageIssue='corrupt';state.decisions=[]; }
    else {
      const migration = migrateStoredDecisions(storedDecisions);
      state.decisions = migration.normalized;
      if (migration.changed && !storageReadOnly) {
        preserveCompatibilityBackup(storedDecisions);
        safeWrite(STORAGE_KEY, state.decisions);
        state.migrationNotice = `${state.decisions.length}개 기존 기록을 새 화면에서도 이어서 보여줘요.`;
      }
      safeWrite(LOCAL_SCHEMA_KEY,{version:LOCAL_SCHEMA_VERSION,updated_at:new Date().toISOString()});
    }
    const storedEvents = safeRead(EVENT_KEY, []);
    if (!Array.isArray(storedEvents)) { storageMode='memory';storageReadOnly=true;storageIssue='corrupt';state.events=[]; }
    else state.events = storedEvents;
    const storedMarket = safeRead('ays-alpha-market-v01', 'KR');
    state.market = MARKET_CONTEXTS[storedMarket] ? storedMarket : 'KR';
    state.syncConsent = safeRead(SYNC_CONSENT_KEY, false) === true;
  }

  function textureMatches(p, pref) {
    if (pref === 'light') return ['젤','플루이드','토너'].includes(p.texture);
    if (pref === 'rich') return ['크림','밤'].includes(p.texture);
    if (pref === 'balanced') return ['로션','세럼','앰플'].includes(p.texture);
    return true;
  }

  const preferenceReasonCopy = {
    past_texture_match:'지난 회고에서 잘 맞았던 사용감과 가까워요.',
    past_texture_mismatch:'지난 회고에서 불편했던 사용감이라 점수를 낮췄어요.',
    past_effect_match:'지난 회고에서 기대와 비슷했던 목적을 반영했어요.',
    past_value:'지난 회고의 가격 대비 만족을 반영해 단가가 낮은 후보를 조금 앞세웠어요.',
    past_availability:'지난 회고의 구매 어려움을 반영해 재고 설정을 더 중요하게 봤어요.',
    past_caution:'지난 회고의 불편 신호를 반영해 근거 상태를 더 조심스럽게 봤어요.',
  };

  function currentFingerprint() {
    return retentionCore.buildPreferenceFingerprint(state.decisions,products,DATA_MODE);
  }

  function scoreProduct(p, answers, fingerprint) {
    let score = 20;
    const reasons = [];
    if (answers.concern && p.concerns.includes(answers.concern)) { score += 30; reasons.push(`${label(answers.concern)} 목적과 연결되는 테스트 태그가 있어요.`); }
    if (answers.skin && answers.skin !== 'unknown' && p.skin.includes(answers.skin)) { score += 22; reasons.push(`${label(answers.skin)} 피부 조건의 비교 후보예요.`); }
    if (answers.texture && textureMatches(p, answers.texture)) { score += 14; reasons.push(`${p.texture} 제형이 선호 사용감과 가까워요.`); }
    const budget = Number(answers.budget || 999999);
    if (p.price <= budget) score += 12; else score -= Math.min(18, Math.round((p.price - budget) / 1000));
    if (answers.avoid === 'fragrance' && p.ingredients.includes('fragrance')) score -= 35;
    if (answers.avoid === 'rich' && ['밤','크림'].includes(p.texture)) score -= 22;
    if (!p.stock) score -= 8;
    if (!reasons.length) reasons.push('입력 조건이 적어 가격·기본 속성으로 비교했어요.');
    const preference = retentionCore.preferenceAdjustment(p,fingerprint,unitPriceReference);
    score += preference.score;
    const preferenceReasons = preference.reason_codes.map((code) => preferenceReasonCopy[code]).filter(Boolean);
    const visibleReasons = preferenceReasons.length ? [reasons[0],preferenceReasons[0]] : reasons.slice(0,2);
    return { ...p, score, reasons:visibleReasons, preference_reason_codes:preference.reason_codes, confidence:p.evidence };
  }

  function calculateCandidatesLocal(excludeId = null) {
    const fingerprint = currentFingerprint();
    const ranked = products.filter((p) => p.id !== excludeId).map((p) => scoreProduct(p,state.answers,fingerprint)).sort((a,b) => b.score - a.score || a.id.localeCompare(b.id));
    if (!ranked.length) return [];
    const best = ranked[0];
    const value = ranked.slice(1).sort((a,b) => (a.price/a.volume)-(b.price/b.volume) || b.score-a.score)[0];
    const different = ranked.find((p) => p.id !== value?.id && p.brand !== best.brand && p.texture !== best.texture) || ranked.find((p) => p.id !== value?.id);
    const roles = [C.roleBest,C.roleValue,C.roleDifferent];
    return [best,value,different].filter(Boolean).filter((p,i,arr) => arr.findIndex((x) => x.id === p.id) === i).map((p,i) => ({...p, role:roles[i]}));
  }

  const roleCopy = { best_fit:C.roleBest, value:C.roleValue, different:C.roleDifferent };
  const reasonCopy = {
    concern:'선택한 고민 목적과 연결되는 근거가 있어요.', skin_type:'입력한 피부 조건의 비교 후보예요.',
    texture:'선호 사용감과 가까운 제형이에요.', budget:'입력한 예산 안에서 비교했어요.',
    ...preferenceReasonCopy,
    default:'가격·사용감·근거 상태를 함께 비교했어요.',
  };
  const alternativeDelta = (item) => item.delta_code === 'lower_price' ? `${won(item.delta_value || 0)} 낮은 테스트 가격`
    : item.delta_code === 'no_fragrance_flag' ? '향 회피 표시가 없는 테스트 후보'
    : item.delta_code === 'similar_texture' ? '제형 또는 마무리감이 비슷한 후보'
    : item.delta_code === 'available' ? '테스트상 구매 가능'
    : item.delta_code === 'lower_unit_price' ? `ml당 ${Math.abs(item.delta_value || 0).toLocaleString('ko-KR')}원 낮은 테스트 단가`
    : '확인된 비교 차이';

  function hydrateCandidate(candidate) {
    const display = candidate.product || (candidate.id ? candidate : products.find((product) => product.id === candidate.product_id));
    if (!display) return null;
    return {
      ...display,
      id:candidate.product_id || display.id,
      role:roleCopy[candidate.role] || candidate.role || display.role,
      score:candidate.score ?? display.score ?? 0,
      reasons:candidate.reasons || (candidate.reason_codes || []).map((code) => reasonCopy[code] || reasonCopy.default).slice(0,2),
      caution:candidate.caveat || display.caution,
      confidence:candidate.confidence || display.evidence || 'low',
    };
  }

  async function remoteRequest(path, options = {}) {
    if (!state.online) throw new Error('offline');
    const response = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers:{ 'content-type':'application/json', 'x-anon-key':getAnonKey(), ...(options.headers || {}) },
    });
    const body = await response.json().catch(() => null);
    if (!response.ok || !body) throw new Error(body?.reason || `http_${response.status}`);
    return body;
  }

  function getAnonKey() {
    const key = 'ays-alpha-anon-key-v01';
    let value = safeRead(key, null);
    if (!value) {
      value = `alpha-${crypto.randomUUID()}`;
      safeWrite(key, value);
    }
    return value;
  }

  async function withApiFallback(remote, local) {
    if (!API_BASE || !state.syncConsent || !state.online) { state.apiSource='local'; return local(); }
    try { const result=await remote(); state.apiSource='remote'; return result; }
    catch { state.apiSource='fallback'; toast('서버 연결이 어려워 기기 안의 테스트 계산으로 계속했어요.'); return local(); }
  }

  const decisionApi = {
    async start(entryPath, answers) {
      return withApiFallback(
        () => remoteRequest('/decision/start', { method:'POST', body:JSON.stringify({
          entry_path:entryPath, data_mode:DATA_MODE, concern:answers.concern,
          skin_type:answers.skin, texture_preference:answers.texture,
          budget_max:Number(answers.budget || 999999), avoid_tags:answers.avoid && answers.avoid !== 'none' ? [answers.avoid] : [],
        }) }),
        () => ({ ok:true, session_id:`local-${Date.now()}`, data_mode:DATA_MODE }),
      );
    },
    async candidates(sessionId) {
      const response = await withApiFallback(
        () => remoteRequest('/decision/candidates', { method:'POST', body:JSON.stringify({ session_id:sessionId }) }),
        () => ({ ok:true, candidates:calculateCandidatesLocal(), shortage_reason:'none', data_mode:DATA_MODE }),
      );
      return (response.candidates || []).map(hydrateCandidate).filter(Boolean);
    },
    async bridge(query) {
      return withApiFallback(
        () => remoteRequest('/bridge/resolve', { method:'POST', body:JSON.stringify(/^\d+$/.test(query) ? {gtin:query} : {name:query}) }),
        () => {
          const normalized=query.toLowerCase();
          const exact=bridgeProducts.filter((product) => product.gtin===query || product.name.toLowerCase()===normalized);
          const partial=exact.length ? exact : bridgeProducts.filter((product) => product.name.toLowerCase().includes(normalized) || product.brand.toLowerCase().includes(normalized));
          const matches=partial.slice(0,3);
          return { ok:true, match_state:matches.length===0?'zero':matches.length>1?'multiple':exact.length?'exact':'partial', matches, data_mode:DATA_MODE };
        },
      );
    },
    async alternatives(base, purpose) {
      const response = await withApiFallback(
        () => remoteRequest(`/products/${encodeURIComponent(base.id)}/alternatives?purpose=${encodeURIComponent(purpose)}&data_mode=${DATA_MODE}`),
        () => ({ ok:true, items:calculateAlternativesLocal(base,purpose), data_mode:DATA_MODE }),
      );
      return (response.items || []).map((item) => ({...(item.product || products.find((product)=>product.id===item.product_id) || item),delta:item.delta || alternativeDelta(item)}));
    },
    async complete(sessionId, product, record) {
      if (!API_BASE || !sessionId) return null;
      return remoteRequest('/decision/complete', { method:'POST', body:JSON.stringify({
        session_id:sessionId,
        selected_product_id:product.id,
        reason_codes:(record.reasons || []).slice(0,2).map((_,index)=>index===0?'primary_reason':'secondary_reason'),
        storage_state:storageMode,
      }) });
    },
  };

  const retentionApi = {
    async register(decisionId) {
      return remoteRequest('/decision-retention/register', { method:'POST', body:JSON.stringify({decision_id:decisionId}) });
    },
    async list() { return remoteRequest('/decision-retention/list'); },
    async feedback(input) {
      return remoteRequest('/decision-retention/feedback', { method:'POST', body:JSON.stringify(input) });
    },
    async preference(decisionId, preference) {
      return remoteRequest('/decision-retention/preference', { method:'POST', body:JSON.stringify({decision_id:decisionId,state:preference}) });
    },
  };

  async function loadCandidates(entryPath) {
    state.entryPath=entryPath;
    state.candidateFilters={concern:'all',texture:'all',budget:'all'};
    state.loadingLabel='후보 세 개를 비교하고 있어요'; state.route='loading'; render();
    const start=await decisionApi.start(entryPath,state.answers);
    state.sessionId=start.session_id;
    state.candidates=await decisionApi.candidates(start.session_id);
    state.pcCandidateIndex=0;
    state.route='candidates'; state.loadingLabel='';
    track('candidate_view',{count:state.candidates.length,shortage_reason:state.candidates.length<3?'insufficient':'none',confidence_mix:'mixed'});
    render();
  }

  function confidenceCopy(value) {
    return value === 'high' ? C.evidenceHigh : value === 'mid' ? C.evidenceMid : C.evidenceLow;
  }

  function header() {
    const standalone = matchMedia('(display-mode: standalone)').matches;
    return `<header class="topbar"><button class="brand" data-action="home">${C.appName}</button><span class="top-spacer"></span><span class="mode" data-data-mode="${DATA_MODE}">${C.dataModeSynthetic}</span>${standalone ? '' : '<button class="icon-btn" data-action="install">앱 설치</button>'}<button class="icon-btn" data-action="library">내 결정 ${state.decisions.length}</button></header>`;
  }

  function storageBar() {
    const memoryMode = storageMode === 'memory';
    const message = storageIssue === 'corrupt' ? '기존 저장 기록 형식을 읽지 못해 원본은 덮지 않고, 현재 입력은 메모리에 유지해요. JSON 가져오기로 복구할 수 있어요.' : state.migrationNotice || (memoryMode ? C.storageMemory : C.storagePersistent);
    return `<div id="storage-state" class="storage-bar ${memoryMode ? 'memory' : ''}" data-storage="${storageMode}" data-storage-issue="${storageIssue || 'none'}" data-storage-migration="${state.migrationNotice ? 'applied' : 'none'}"><span class="storage-dot"></span><strong>${memoryMode ? '임시 저장' : '기기 저장'}</strong><span>${message}</span></div>`;
  }

  function layout(body) {
    const pcDock = `<aside class="pc-handoff-dock" data-pc-handoff="true" aria-label="폰으로 이어서 보기"><img data-pc-qr="true" src="${PUBLIC_QR_DATA}" alt="올영스캐너 공개 앱 QR 코드"><div><strong>폰으로 이어서 보기</strong><span>현재 검증된 공개 주소를 열어요.</span><a data-pc-canonical-link="true" href="${PUBLIC_APP_URL}" target="_blank" rel="noopener">공개 앱 열기</a><button class="ghost-btn" data-action="pc-shortcuts" aria-expanded="${state.pcHelpOpen}">단축키 도움말 ?</button></div></aside>`;
    const pcHelp = state.pcHelpOpen ? `<section class="pc-shortcut-panel" data-pc-shortcut-panel="true" role="dialog" aria-modal="true" aria-labelledby="pc-shortcut-title"><div><span class="pc-area-label">KEYBOARD</span><h2 id="pc-shortcut-title">PC 단축키</h2><dl><div><dt>← / →</dt><dd>후보 사이를 이동해요.</dd></div><div><dt>Space / Enter</dt><dd>현재 후보를 결정 1건으로 저장해요.</dd></div></dl><button class="primary-btn" data-action="pc-shortcuts-close">확인</button></div></section>` : '';
    return `<div class="shell">${header()}<main id="main" class="content" tabindex="-1">${body}<p class="footer-note">${C.medicalDisclaimer}<br>${C.testPriceNotice}</p></main>${pcDock}${pcHelp}${storageBar()}</div>`;
  }

  function homePreviewCard(product, index) {
    const fit = product.concerns.slice(0,2).map(label);
    const previewConcern = product.concerns[0] || 'moisture';
    return `<article class="pc-discovery-card" data-home-preview-product="${product.id}"><div class="pc-product-visual tone-${index+1}" aria-hidden="true"><span></span></div><div class="pc-discovery-copy"><span class="pc-evidence-pill">근거 ${confidenceCopy(product.evidence)}</span><p>${escapeHtml(product.brand)}</p><h3>${escapeHtml(product.name.replace(/^테스트 /,''))}</h3><div class="pc-fit-tags">${fit.map((item)=>`<span>${escapeHtml(item)}</span>`).join('')}</div><p class="pc-preview-caveat">확인할 점 · ${escapeHtml(product.caution)}</p><button class="secondary-btn wide" data-home-concern="${previewConcern}">이 고민으로 비교</button></div></article>`;
  }

  function homeView() {
    const recent = state.decisions.slice(0,3);
    const latest = recent[0];
    const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
    const recentWeek = state.decisions.filter((decision) => Number.isFinite(Date.parse(decision.selected_at)) && Date.parse(decision.selected_at) >= sevenDaysAgo).length;
    const brandCount = new Set(state.decisions.map((decision) => decision.brand).filter(Boolean)).size;
    const chartMax = Math.max(1,state.decisions.length,brandCount,recentWeek);
    const chartRows = [['저장 결정',state.decisions.length],['브랜드 폭',brandCount],['최근 7일',recentWeek]];
    const pcWorkbench = `<section class="pc-workbench" data-pc-workbench="true" aria-label="내 결정 책상"><article class="pc-work-area" data-pc-area="counter-list"><span class="pc-area-label">최근 결정</span><h2>${recent.length ? '다시 볼 기록' : '첫 기록을 기다려요'}</h2><strong class="pc-big-number">${state.decisions.length}</strong><ul class="pc-compact-list">${recent.length ? recent.map((decision) => `<li><span>${escapeHtml(decision.name)}</span><small>${new Date(decision.selected_at).toLocaleDateString('ko-KR')}</small></li>`).join('') : '<li><span>결정하면 이곳에서 바로 이어볼 수 있어요.</span><small>0건</small></li>'}</ul><button class="ghost-btn" data-action="pc-library">전체 결정 보기</button></article><article class="pc-work-area" data-pc-area="today-summary"><span class="pc-area-label">오늘 할 일</span><h2>${latest ? '이 결정을 이어보세요' : '후보부터 줄여보세요'}</h2><p>${latest ? `<strong>${escapeHtml(latest.name)}</strong><br>${escapeHtml(latest.brand)}의 사용법과 회고 시점을 확인할 수 있어요.` : '질문 다섯 개에 답하면 비교할 후보를 세 개까지만 남겨드려요.'}</p><button class="secondary-btn" data-action="pc-start-quiz">빠른 결정 시작</button></article><article class="pc-work-area" data-pc-area="portfolio"><span class="pc-area-label">결정 분포</span><h2>기기 안 기록</h2><div class="pc-portfolio-metrics"><div><strong>${brandCount}</strong><span>브랜드</span></div><div><strong>${recentWeek}</strong><span>최근 7일</span></div><div><strong>${state.decisions.length}</strong><span>누적 결정</span></div></div><p class="muted">이 브라우저에 저장된 테스트 결정만 집계해요.</p></article><article class="pc-stat-stage" data-pc-large-stats="true"><div><span class="pc-area-label">한눈에 보기</span><h2>결정 흐름</h2></div><div class="pc-stat-chart" role="img" aria-label="저장 결정, 브랜드 폭, 최근 7일 막대 비교">${chartRows.map(([labelText,value]) => `<div class="pc-stat-row"><span>${labelText}</span><div><i style="width:${Math.max(value ? 12 : 2,Math.round(value/chartMax*100))}%"></i></div><strong>${value}</strong></div>`).join('')}</div></article></section>`;
    const previewProducts = [products[0],products[1],products[2],products[4]];
    const pcHome = `<section class="pc-home-v2" data-pc-home-v2="true" aria-label="PC 첫 화면"><nav class="pc-home-nav" aria-label="주요 메뉴"><button data-action="home" aria-current="page">홈</button><button data-action="pc-start-quiz">빠른 결정</button><button data-action="pc-ranking">비교 후보</button><button data-action="pc-usage">사용법</button><button data-action="pc-library">내 결정</button></nav><section class="pc-home-hero"><div><p class="eyebrow">DECISION, NOT ENDLESS SEARCH</p><h1>오늘 살 제품,<br>세 개까지만 남겨볼까요?</h1><p>상품을 더 늘어놓기보다 내 조건에 맞는 비교 후보부터 줄여드려요.</p></div><form id="pc-home-search" role="search"><label for="pc-home-search-input">제품·브랜드·고민 검색</label><div class="pc-home-search-box"><input id="pc-home-search-input" type="search" autocomplete="off" placeholder="예: 테스트 수분크림, 브랜드, 테스트 GTIN"><button class="primary-btn" type="submit">찾기</button></div><small>실상품 검색이 아닌 알파 테스트 데이터 검색입니다.</small></form></section><section class="actions-grid pc-home-actions" aria-label="시작 방법"><button class="entry primary" data-action="pc-start-quiz" data-home-primary="true"><span class="emoji">✦</span><strong>내 고민으로 3개 압축</strong><span>다섯 가지 질문으로 비교할 후보만 남겨요.</span></button><button class="entry" data-action="pc-bridge"><span class="emoji">↔</span><strong>쓰던 제품에서 시작</strong><span>같은 점과 다른 점을 보고 대안을 찾아요.</span></button><button class="entry" data-action="pc-ranking"><span class="emoji">◎</span><strong>후보 먼저 둘러보기</strong><span>테스트 상품을 목적별로 빠르게 비교해요.</span></button></section><section class="pc-quick-concerns" aria-labelledby="pc-quick-title"><div><p class="eyebrow">빠른 시작</p><h2 id="pc-quick-title">지금 가장 가까운 고민은?</h2></div><div class="pc-concern-list"><button data-home-concern="moisture">수분 부족</button><button data-home-concern="soothing" data-home-skin="sensitive">민감함</button><button data-home-concern="soothing" data-home-skin="oily">트러블</button><button data-home-concern="sun">자외선</button><button data-action="pc-usage">세정</button><button data-home-concern="redness">진정</button></div></section><div class="notice warning pc-home-honesty" data-home-honesty="true"><strong>알파 테스트 데이터</strong><span>실제 상품·가격·평점·인기 순위가 아니며 비교 흐름을 확인하기 위한 후보입니다.</span></div><section class="pc-discovery" aria-labelledby="pc-discovery-title"><div class="pc-section-heading"><div><p class="eyebrow">바로 비교하기</p><h2 id="pc-discovery-title">지금 비교해 볼 후보</h2></div><button class="ghost-btn" data-action="pc-ranking">목적별 전체보기</button></div><div class="pc-discovery-grid">${previewProducts.map(homePreviewCard).join('')}</div></section>${pcWorkbench}</section>`;
    const pcDesk = `<aside class="pc-desk" data-pc-home="true" aria-label="오늘의 결정"><p class="eyebrow">TODAY'S DECISION</p><h2>${latest ? '이어볼 결정이 있어요' : '첫 결정을 시작해요'}</h2><p class="muted">${latest ? `${escapeHtml(latest.name)}의 사용법과 회고 시점을 바로 확인하세요.` : '후보를 세 개로 줄이고 맞는 이유와 감수할 점을 함께 저장해요.'}</p><div class="pc-decision-slots" aria-label="결정 진행"><span class="filled"></span><span class="${state.decisions.length>0?'filled':''}"></span><span class="${state.decisions.length>1?'filled':''}"></span><strong>${Math.min(state.decisions.length,3)} / 3</strong></div><section class="pc-summary" aria-label="기기 저장"><h3>이 기기에 저장한 결정</h3><p><strong data-pc-decision-count>${state.decisions.length}건</strong> · 로그인 없이 이 브라우저에만 보관해요.</p></section><div class="pc-desk-actions"><button class="primary-btn wide" data-action="pc-ranking">후보 비교 시작</button><button class="secondary-btn wide" data-action="pc-library">내 결정 이어보기</button></div></aside>`;
    const mobileHome = `<div class="mobile-home-legacy"><section class="hero"><p class="eyebrow">Decision, not endless search</p><h1>${C.homeTitle}</h1><p class="muted">${C.homeSub}</p></section>
      <section class="actions-grid" aria-label="시작 방법">
        <button class="entry primary" data-action="start-quiz"><span class="emoji">✦</span><strong>${C.startConcern}</strong><span>5가지 질문으로 후보를 세 개까지 압축해요.</span></button>
        <button class="entry" data-action="bridge"><span class="emoji">↔</span><strong>${C.startBridge}</strong><span>익숙한 제품의 같은 점과 다른 점에서 출발해요.</span></button>
        <button class="entry" data-action="barcode"><span class="emoji">▥</span><strong>${C.startBarcode}</strong><span>알파에서는 테스트 GTIN으로 상품을 확인해요.</span></button>
        <button class="entry" data-action="ranking"><span class="emoji">◎</span><strong>${C.startRanking}</strong><span>테스트 상품을 목적별로 빠르게 둘러봐요.</span></button>
        <button class="entry usage-entry" data-action="usage"><span class="emoji">◫</span><strong>${C.startUsage}</strong><span>${C.usageHomeSub}</span></button>
      </section>
      <div class="notice warning"><strong>알파 데이터</strong><span>${C.dataModeSynthetic} 커버리지·가격·평점 성과로 사용할 수 없습니다.</span></div>
      ${preferenceFingerprintView()}
      ${recent.length ? `<section><h2>최근 결정</h2><div class="decision-list">${recent.map(decisionRow).join('')}</div></section>` : ''}</div>`;
    return layout(`${pcHome}${mobileHome}${pcDesk}`);
  }

  function sectionHead(title, sub, back = 'home') {
    return `<div class="section-head"><button class="back" data-action="${back}" aria-label="이전 화면">←</button><div><h2>${title}</h2><p class="muted">${sub}</p></div></div>`;
  }

  const usageTypeLabels = { all:'전체', minimal_routine:'최소 루틴', order:'제품 순서', category:'카테고리', situation:'상황별', mistake:'실수 줄이기' };
  const usageEvidenceLabels = { product_label:'제품 표시', official_safety:'공식 안전자료', professional_guidance:'전문가 일반조언', cultural_practice:'문화적 관행' };
  const usageOptionalityLabels = { basic:'기본', optional:'선택', situational:'상황별', do_not_use:'사용하지 않음' };
  const usageStarts = [
    ['minimal_routine','처음 시작해요','세안·보습·낮의 자외선 보호부터 봐요.'],
    ['order','제품 순서가 궁금해요','아침·저녁 순서와 선택 단계를 확인해요.'],
    ['category','이 제품은 어떻게 써요?','토너·패드·세럼·크림처럼 종류로 찾아요.'],
    ['combine','같이 써도 될까요?','겹치는 목적과 불편 신호를 먼저 확인해요.'],
    ['discomfort','사용 후 불편해요','참지 말아야 할 신호와 다음 행동을 봐요.'],
  ];

  function usageCardForProduct(product) {
    if (!product) return null;
    let slug = 'how-to-use-cream-balm';
    if (product.concerns?.includes('sun')) slug = 'how-to-use-sunscreen-stick';
    else if (product.texture === '토너') slug = 'how-to-use-toner';
    else if (['앰플','세럼'].includes(product.texture)) slug = 'how-to-use-ampoule-serum';
    else if (product.texture === '로션') slug = 'how-to-use-emulsion';
    return usageCards.find((card) => card.slug === slug) || null;
  }

  function decisionUsage(decision) {
    const product = products.find((item) => item.id === decision?.product_id);
    return usageCards.find((card) => card.slug === decision?.usage_slug) || usageCardForProduct(product);
  }

  function usageAmount(card) {
    return card?.steps.find((step) => step.amount_copy)?.amount_copy || '제품 표시사항의 사용량·빈도를 먼저 따르세요.';
  }

  function usageMatches() {
    const query = state.usageQuery.trim().toLocaleLowerCase('ko-KR');
    return usageCards.filter((card) => {
      if (state.usageFilter !== 'all' && card.content_type !== state.usageFilter) return false;
      if (!query) return true;
      return JSON.stringify(card).toLocaleLowerCase('ko-KR').includes(query);
    });
  }

  function usagePreview(card) {
    return `<article class="usage-card" data-usage-card="${escapeHtml(card.slug)}"><div class="usage-meta"><span>${escapeHtml(usageTypeLabels[card.content_type] || card.content_type)}</span><span>${escapeHtml(usageEvidenceLabels[card.evidence_level] || card.evidence_level)}</span></div><h3>${escapeHtml(card.title)}</h3><p>${escapeHtml(card.summary)}</p><p class="usage-answer"><strong>한 줄 답</strong>${escapeHtml(card.body.one_line)}</p><button class="secondary-btn wide" data-action="usage-open" data-usage-slug="${escapeHtml(card.slug)}">단계와 근거 보기</button></article>`;
  }

  function usageHubView() {
    const cards = usageMatches();
    return layout(`${sectionHead(C.startUsage,C.usageHomeSub,'home')}<div class="notice warning usage-review"><strong>${C.usageReviewNotice}</strong><span>24개 모두 review 상태이며, 제품 표시사항과 다르면 표시사항을 먼저 따릅니다.</span></div>
      <section aria-labelledby="usage-start-title"><h3 id="usage-start-title">어디서 시작할까요?</h3><div class="usage-starts">${usageStarts.map(([key,title,description])=>`<button class="usage-start" data-usage-start="${key}"><strong>${title}</strong><span>${description}</span></button>`).join('')}</div></section>
      <section class="usage-controls" aria-labelledby="usage-find-title"><h3 id="usage-find-title">24개 사용법에서 찾기</h3><form id="usage-search-form" role="search"><label for="usage-search"><strong>제품 종류나 궁금한 점</strong></label><div class="input-row"><input id="usage-search" type="search" value="${escapeHtml(state.usageQuery)}" autocomplete="off" placeholder="예: 선크림, 패드, 여행"><button class="primary-btn" type="submit">검색</button></div></form><div class="usage-filters" aria-label="사용법 묶음">${Object.entries(usageTypeLabels).map(([key,labelText])=>`<button class="purpose ${state.usageFilter===key?'active':''}" data-usage-filter="${key}" aria-pressed="${state.usageFilter===key}">${labelText}</button>`).join('')}</div></section>
      <p class="usage-count" role="status"><strong>${cards.length}개</strong>를 보여드려요.</p><section id="usage-results" class="usage-grid" aria-label="사용법 검색 결과">${cards.length?cards.map(usagePreview).join(''):'<div class="empty">일치하는 사용법이 없어요. 검색어를 줄이거나 전체 묶음을 확인해 주세요.</div>'}</section>`);
  }

  function usageDetailView() {
    const card = usageCards.find((item) => item.slug === state.selectedUsage);
    if (!card) return usageHubView();
    const sources = card.source_refs.map((id) => usageSourceById.get(id)).filter(Boolean);
    const product = products.find((item) => item.id === state.usageContextProductId) || (state.selected?.id === state.usageContextProductId ? state.selected : null);
    const context = product ? `<div class="notice product-usage-context" data-product-usage-context="${escapeHtml(product.id)}"><strong>${escapeHtml(product.name)}</strong><span>합성 테스트 상품의 제형을 카테고리 가이드에 연결했습니다. 개별 제품 표시사항을 확인하세요.</span></div>` : '';
    return layout(`${sectionHead(card.title,'한 화면에서 실행하고, 불편하면 멈추는 내부 검수용 가이드','usage-back')}${context}<div class="notice warning usage-review"><strong>${C.usageReviewNotice}</strong><span>개별 제품 표시사항을 대신하지 않으며 질환을 진단하거나 치료하지 않습니다.</span></div><article class="usage-detail" data-usage-detail="${escapeHtml(card.slug)}"><div class="usage-meta"><span>${escapeHtml(usageTypeLabels[card.content_type] || card.content_type)}</span><span>${escapeHtml(usageEvidenceLabels[card.evidence_level] || card.evidence_level)}</span></div><p class="usage-lead">${escapeHtml(card.body.one_line)}</p><dl class="usage-fields"><div><dt>루틴 위치</dt><dd>${escapeHtml(card.body.routine_position)}</dd></div><div><dt>제품 표시사항</dt><dd>${escapeHtml(card.body.label_priority)}</dd></div><div><dt>같이 쓰기</dt><dd>${escapeHtml(card.body.combine_note)}</dd></div></dl><h3>따라 하기</h3><ol class="usage-steps">${card.steps.map((step)=>`<li><span class="role">${escapeHtml(usageOptionalityLabels[step.optionality] || step.optionality)}</span><p>${escapeHtml(step.instruction)}</p>${step.amount_copy?`<small>사용량·빈도 · ${escapeHtml(step.amount_copy)}</small>`:''}${step.stop_signal?`<strong class="stop-signal">중단 기준 · ${escapeHtml(step.stop_signal)}</strong>`:''}</li>`).join('')}</ol><div class="notice warning"><strong>불편 신호</strong><span>${escapeHtml(card.body.safety_note)}</span></div><h3>근거와 관측일</h3><ul class="source-list">${sources.map((source)=>`<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.title)}</a><small>${escapeHtml(source.source_type)} · ${new Date(source.observed_at).toLocaleDateString('ko-KR')} 관측</small></li>`).join('')}</ul></article>`);
  }

  function quizView() {
    const q = questions[state.quizStep];
    const pct = ((state.quizStep + 1) / questions.length) * 100;
    return layout(`${sectionHead(q.title, `${state.quizStep+1}/${questions.length} · 답은 이 기기에만 임시 저장돼요.`, state.quizStep ? 'quiz-back' : 'home')}<div class="mobile-step-chip" data-mobile-step="${state.quizStep+1}" aria-label="질문 ${state.quizStep+1}, 전체 ${questions.length}단계"><strong>${state.quizStep+1}</strong><span>/ ${questions.length} 단계</span></div>
      ${state.recalculateNotice?`<div class="notice"><strong>내 조건으로 새로 계산해요</strong><span>${C.shareRecalculatePrivacy}</span></div>`:''}
      <div class="progress" aria-label="질문 진행률"><span style="width:${pct}%"></span></div>
      <button class="why" data-action="why" aria-expanded="false">${C.quickWhy}</button><div id="why-text" class="notice" hidden>${q.why}</div>
      <div class="choices">${q.choices.map(([value,text]) => `<button class="choice" data-answer="${value}">${text}</button>`).join('')}<button class="choice skip" data-answer="unknown">${C.quickSkip}</button></div>`);
  }

  function candidateCard(p, index) {
    const usage = usageCardForProduct(p);
    const truth = productTruth(p);
    const pcKeyboard = matchMedia('(min-width:1024px)').matches;
    const keyboardAttrs = pcKeyboard ? ` tabindex="${index === state.pcCandidateIndex ? '0' : '-1'}" aria-current="${index === state.pcCandidateIndex ? 'true' : 'false'}" aria-label="후보 ${index+1}: ${p.name}"` : '';
    const avoidConflict = (state.answers.avoid === 'fragrance' && p.ingredients.includes('fragrance')) || (state.answers.avoid === 'rich' && ['밤','크림'].includes(p.texture));
    return `<article class="card ${index === 0 ? 'best' : ''} ${pcKeyboard && index === state.pcCandidateIndex ? 'keyboard-active' : ''}" data-candidate="${p.id}" data-avoid-conflict="${avoidConflict}"${keyboardAttrs}><span class="role">${p.role}</span><h3>${p.name}</h3><p class="product-sub">${p.brand} · ${p.volume}ml · ${p.texture}</p><p class="price">${truth.price} <small>${truth.unit}</small></p><div class="mobile-unit-price" data-mobile-unit-price="${truth.unit === '알 수 없음' ? 'unknown' : 'known'}"><strong>용량당 단가</strong><span>${truth.unit === '알 수 없음' ? '알 수 없음' : truth.unit}</span><small>${truth.unit === '알 수 없음' ? '가격 또는 용량 기준이 없어 비교하지 않아요.' : `${p.volume}ml 기준으로 계산`}</small></div>
      <ul class="reason-list">${p.reasons.map((r) => `<li>${r}</li>`).join('')}</ul><p class="caveat"><strong>감수할 점</strong><br>${p.caution}</p><p class="confidence">근거 상태 · ${confidenceCopy(p.confidence)}</p>
      ${dataTruthCard(p)}
      ${mobileEvidenceDrawer(p)}
      ${usage ? `<dl class="product-usage-summary"><div><dt>루틴 위치</dt><dd>${escapeHtml(usage.body.routine_position)}</dd></div><div><dt>단계</dt><dd>${escapeHtml(usageOptionalityLabels[usage.steps[0]?.optionality] || '선택')}</dd></div><div><dt>처음 사용</dt><dd>${escapeHtml(usageAmount(usage))}</dd></div></dl>` : ''}
      <div class="card-actions"><button class="primary-btn" data-action="select" data-product="${p.id}">${C.choose}</button><button class="secondary-btn" data-action="alternatives" data-product="${p.id}">${C.alternatives}</button>${usage ? `<button class="secondary-btn" data-action="product-usage" data-product="${p.id}" data-product-usage="${p.id}">${C.usageForProduct}</button>` : ''}</div></article>`;
  }

  function candidatesView() {
    if (!state.candidates.length) return layout(`${sectionHead(C.candidateTitle,C.noCandidates,'home')}<div class="empty">${C.noCandidates}</div>`);
    const sourceCopy=state.apiSource==='remote'?'서버 계산':state.apiSource==='fallback'?'서버 연결 실패 · 기기 계산':'기기 안 테스트 계산';
    const fingerprint=currentFingerprint();

  }

  function compareView() {
    const candidates = filteredCandidates();
    const rows = [
      ['역할',(p) => p.role],['맞는 이유',(p) => p.reasons.join(' / ')],['감수할 점',(p) => p.caution],['가격·단가',(p) => { const truth=productTruth(p); return `${truth.price} · ${truth.unit}`; }],['출처·확인 시각',(p) => { const truth=productTruth(p); return `${truth.source} · ${truth.observed}`; }],['사용감',(p) => `${p.texture} · ${p.finish}`],['사용법',(p) => usageCardForProduct(p)?.body.routine_position || '제품 표시사항 확인'],['향 설정',(p) => p.scent],['구매 가능',(p) => { const truth=productTruth(p); return `${truth.purchase} · ${truth.purchaseNote}`; }],['근거',(p) => confidenceCopy(p.confidence)],
    ];
    return layout(`${sectionHead('차이가 큰 것부터 비교해요','가격과 상품 정보는 모두 화면 검증용 값입니다.','candidates')}<div class="compare-wrap"><table class="compare" id="compare-table"><thead><tr><th>비교 기준</th>${candidates.map((p) => `<th>${p.name}</th>`).join('')}</tr></thead><tbody>${rows.map(([name,fn]) => `<tr><th>${name}</th>${candidates.map((p) => `<td>${fn(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="toolbar">${candidates.map((p) => `<button class="secondary-btn" data-action="select" data-product="${p.id}">${p.name} 선택</button>`).join('')}</div>`);

  function bridgeView(barcode = false) {
    return layout(`${sectionHead(C.bridgeTitle,C.bridgeSub,'home')}<form id="bridge-form" class="form-card"><label for="bridge-query"><strong>${barcode ? '테스트 GTIN' : '제품명·브랜드·GTIN'}</strong></label><p class="muted">예: ${barcode ? '9900000000001' : '테스트 기존 수분크림'}</p><div class="input-row"><input id="bridge-query" type="search" required autocomplete="off" placeholder="${barcode ? 'GTIN 입력' : '제품명 또는 GTIN 입력'}"><button class="primary-btn" type="submit">제품 확인</button></div></form><div id="bridge-result" aria-live="polite"></div>`);

  function bridgeMatchCard(match) {
    return `<section class="form-card"><p class="eyebrow">부분 유사 비교 출발점</p><h2>${match.name}</h2><p>${match.brand} · GTIN ${match.gtin}</p><div class="fingerprint"><div><small>목적</small>${label(match.concern)}</div><div><small>제형</small>${match.texture}</div><div><small>좋았던 점</small>${match.liked}</div><div><small>아쉬운 점</small>${match.disliked}</div></div><p class="notice warning">동일 상품을 찾았다는 뜻이 아닙니다. 입력한 테스트 지문과 일부 조건이 비슷한 후보를 찾습니다.</p><button class="primary-btn wide" data-action="bridge-candidates">이 조건으로 후보 3개 보기</button></section>`;
  }

  function bridgeResult(result) {
    if (!result || result.match_state === 'zero') return `<div class="empty" data-bridge-state="zero">${C.bridgeZero}<div class="toolbar"><button class="primary-btn" data-action="start-quiz">일반 퀵진단 시작</button></div></div>`;
    if (result.match_state === 'multiple') return `<section data-bridge-state="multiple"><div class="notice"><strong>${result.matches.length}개가 비슷해요</strong><span>사용하던 제품을 하나 골라주세요.</span></div><div class="decision-list">${result.matches.map((match,index)=>`<article class="decision"><div><h3>${match.name}</h3><p class="muted">${match.brand} · ${match.gtin}</p></div><button class="secondary-btn" data-action="choose-bridge" data-bridge-index="${index}">이 제품</button></article>`).join('')}</div></section>`;
    return `<div data-bridge-state="${result.match_state}">${bridgeMatchCard(result.matches[0])}</div>`;
  }

  function calculateAlternativesLocal(base, purpose) {
    const rest = products.filter((p) => p.id !== base.id);
    if (purpose === 'cheaper') return rest.filter((p) => p.price < base.price).sort((a,b) => a.price-b.price).slice(0,3).map((p) => ({...p,delta:`${won(base.price-p.price)} 낮은 테스트 가격`}));
    if (purpose === 'gentler') return rest.filter((p) => !p.ingredients.includes('fragrance')).slice(0,3).map((p) => ({...p,delta:'향 설정이 없는 테스트 후보'}));
    if (purpose === 'texture') return rest.filter((p) => p.finish === base.finish || p.texture === base.texture).slice(0,3).map((p) => ({...p,delta:`${p.texture} · ${p.finish} 유사`}));
    if (purpose === 'available') return rest.filter((p) => p.stock).slice(0,3).map((p) => ({...p,delta:'테스트상 구매 가능'}));
    return rest.sort((a,b) => a.price/a.volume-b.price/b.volume).slice(0,3).map((p) => ({...p,delta:`${perUnit(p)} 테스트 단가`}));
  }

  function alternativesView() {
    const base = state.baseProduct;
    const labels = {cheaper:'더 저렴함',gentler:'향 설정 제외',texture:'비슷한 사용감',available:'지금 구매 가능',unit:'단가 우세'};
    const list = state.alternatives;
    return layout(`${sectionHead(`${base.name}의 다른 선택`,'우위가 확인된 항목만 차이로 표시합니다.','candidates')}<div class="purpose-chips">${Object.entries(labels).map(([key,text]) => `<button class="purpose ${state.purpose === key ? 'active' : ''}" data-purpose="${key}">${text}</button>`).join('')}</div><div id="alternative-list" class="alt-list">${list.length ? list.map((p,i) => `<article class="alt"><div><h3>${p.name}</h3><p class="muted">${p.brand} · ${won(p.price)} · ${p.texture}</p><p class="delta">기준 대비 · ${p.delta}</p></div><button class="secondary-btn" data-action="select" data-product="${p.id}">선택</button></article>`).join('') : `<div class="empty">이 기준에서 확인된 대안이 없어요.</div>`}</div>`);
  }

  function loadingView() {
    return layout(`${sectionHead('잠시만 기다려 주세요','입력한 조건은 이 결정에만 사용해요.','home')}<div class="empty" role="status"><strong>${state.loadingLabel}</strong><p class="muted">연결이 안 되면 기기 안의 테스트 계산으로 자동 복구합니다.</p></div>`);
  }

  async function loadAlternatives() {
    state.loadingLabel='다른 선택을 비교하고 있어요'; state.route='loading'; render();
    state.alternatives=await decisionApi.alternatives(state.baseProduct,state.purpose);
    state.route='alternatives'; state.loadingLabel=''; render();
  }

  function hydrateDecisionRetention(decision) {
    if (!decision || typeof decision !== 'object') return decision;
    const metadata = { concern:decision.metadata?.concern || decision.concern || '', usage_period:decision.metadata?.usage_period || 'not_started', repurchase:decision.metadata?.repurchase || 'undecided' };
    if (decision.follow_up) return { ...decision, metadata, follow_up:retentionCore.presentFollowUp(decision.follow_up) };
    const product = products.find((item) => item.id === decision.product_id);
    if (!product) return { ...decision, metadata };
    return {
      ...decision,
      metadata,
      follow_up:retentionCore.createLocalFollowUp(decision, product, syntheticObservations[product.id] || {}),
      follow_up_source:'local',
    };
  }

  function replaceDecision(next) {
    state.decisions = state.decisions.map((item) => item.product_id === next.product_id ? next : item);
    safeWrite(STORAGE_KEY,state.decisions);
  }

  async function syncDecisionRetention(record, product) {
    if (!API_BASE || !state.syncConsent || !state.online || !state.sessionId) return record;
    try {
      const completed = await decisionApi.complete(state.sessionId,product,record);
      if (!completed?.ok) return record;
      const withServerId = { ...record, id:completed.decision_id };
      replaceDecision(withServerId);
      const registered = await retentionApi.register(completed.decision_id);
      if (!registered?.ok || !registered.follow_up) return withServerId;
      const synced = { ...withServerId, follow_up:retentionCore.presentFollowUp(registered.follow_up), follow_up_source:'remote' };
      replaceDecision(synced);
      return synced;
    } catch {
      state.apiSource='fallback';
      toast('로그인된 반복사용 서버에 연결되지 않아 기기 내 합성 회고로 계속해요.');
      return record;
    }
  }

  async function loadLibrary() {
    if (API_BASE && state.syncConsent && state.online) {
      try {
        const response = await retentionApi.list();
        const byId = new Map((response.items || []).map((item) => [item.decision_id,item]));
        let changed = false;
        state.decisions = state.decisions.map((decision) => {
          const followUp = byId.get(decision.id);
          if (!followUp) return decision;
          changed = true;
          return { ...decision, follow_up:retentionCore.presentFollowUp(followUp), follow_up_source:'remote' };
        });
        if (changed) safeWrite(STORAGE_KEY,state.decisions);
      } catch { state.apiSource='fallback'; }
    }
    state.route='library';render();
  }

  async function saveDecision(product) {
    const usage = usageCardForProduct(product);
    const record = { id:`d-${Date.now()}`, product_id:product.id, name:product.name, brand:product.brand, role:product.role || '대안 선택', reasons:(product.reasons || ['직접 비교 후 선택했어요.']).slice(0,2), selected_at:new Date().toISOString(), data_observed_at:product.observed_at || null, data_source:product.source_label || null, data_mode:DATA_MODE, usage_slug:usage?.slug || null, usage_title:usage?.title || null, usage_version:usage ? 1 : null, metadata:{concern:state.answers.concern || '',usage_period:'not_started',repurchase:'undecided'} };
    record.follow_up = retentionCore.createLocalFollowUp(record,product,syntheticObservations[product.id] || {});
    record.follow_up_source = 'local';
    state.decisions = [record,...state.decisions.filter((d) => d.product_id !== product.id)].slice(0,20);
    safeWrite(STORAGE_KEY,state.decisions);
    state.selected = product;
    track('decision_complete',{action:'select',elapsed_bucket:'alpha'});
    state.route='card';
    render();
    const synced = await syncDecisionRetention(record,product);
    if (synced !== record) render();
  }

  function publicReasons(product) {
    const safe = (product.reasons || []).filter((reason) => !reason.includes('피부 조건'));
    return safe.length ? safe.slice(0,2) : ['가격·사용감·감수할 점을 비교해 선택했어요.'];
  }

  const encodeShare=(value)=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(value)))).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');
  const decodeShare=(value)=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(value.replaceAll('-','+').replaceAll('_','/')+'==='.slice((value.length+3)%4)),(ch)=>ch.charCodeAt(0))));
  const shareKey=(payload)=>payload.candidates.map((candidate)=>candidate.product.id).join('.');

  function safeSharedPayload(input) {
    if(!input||input.version!==2||input.mode!=='vote'||input.data_mode!==DATA_MODE||!Array.isArray(input.candidates)||input.candidates.length!==2)return null;
    const candidates=[];
    for(const candidate of input.candidates){
      if(!candidate?.product||typeof candidate.product.id!=='string'||typeof candidate.product.name!=='string'||typeof candidate.product.brand!=='string')return null;
      candidates.push({
        product:{id:String(candidate.product.id).slice(0,80),name:String(candidate.product.name).slice(0,120),brand:String(candidate.product.brand).slice(0,120)},
        role:String(candidate.role||'비교 후보').slice(0,40),
        reason_codes:Array.isArray(candidate.reason_codes)?candidate.reason_codes.filter((value)=>typeof value==='string').slice(0,2):[],
        caveat:String(candidate.caveat||'직접 사용감을 확인해 주세요.').slice(0,240),
        confidence:['high','mid','low'].includes(candidate.confidence)?candidate.confidence:'low',
      });
    }
    if(candidates[0].product.id===candidates[1].product.id)return null;
    return {version:2,mode:'vote',data_mode:DATA_MODE,candidates,privacy:{profile_included:false,avoid_tags_included:false,owner_identity_included:false},actions:{vote:true,recalculate:true}};
  }

  function createVoteShare() {
    const alternative=state.candidates.find((candidate)=>candidate.id!==state.selected.id);
    if(!alternative){toast('비교할 두 번째 후보가 없어요.');return;}
    const toPublic=(product)=>({product:{id:product.id,name:product.name,brand:product.brand},role:product.role||'비교 후보',reason_codes:publicReasons(product),caveat:product.caution||'직접 사용감을 확인해 주세요.',confidence:product.confidence||'low'});
    state.sharePayload=safeSharedPayload({version:2,mode:'vote',data_mode:DATA_MODE,candidates:[toPublic(state.selected),toPublic(alternative)]});
    state.shareLink=`${location.origin}${location.pathname}#share=${encodeShare(state.sharePayload)}`;
    state.route='share-preview';
    track('decision_card_create',{format:'link',safe_fields:'two_products_reasons'});
    render();
  }

  function sharedCandidateCard(candidate,friend=false) {
    const voted=state.friendVote===candidate.product.id;
    return `<article class="card share-choice" data-share-candidate="${escapeHtml(candidate.product.id)}"><span class="role">${escapeHtml(candidate.role)}</span><h3>${escapeHtml(candidate.product.name)}</h3><p class="product-sub">${escapeHtml(candidate.product.brand)}</p><ul class="reason-list">${candidate.reason_codes.map((reason)=>`<li>${escapeHtml(reason)}</li>`).join('')}</ul><p class="caveat"><strong>감수할 점</strong><br>${escapeHtml(candidate.caveat)}</p>${friend?`<button class="${voted?'primary-btn':'secondary-btn'} wide" data-action="friend-vote" data-product="${escapeHtml(candidate.product.id)}">${voted?'이 기기에서 선택함':'이 제품에 투표'}</button>`:''}</article>`;
  }

  }

  function friendCardView() {
    const payload=state.sharePayload;
    return layout(`${sectionHead('친구가 두 제품 중 고민하고 있어요','제품 차이를 보고 한 표를 보태거나, 내 조건으로 다시 찾아보세요.','home')}<section class="cards vote-grid" data-friend-card="true">${payload.candidates.map((candidate)=>sharedCandidateCard(candidate,true)).join('')}</section><p class="local-vote-result" aria-live="polite">${state.friendVote?'이 기기의 투표를 반영했어요. 실제 친구 투표 집계는 공개 서버 연결 후 제공됩니다.':'아직 이 기기에서 투표하지 않았어요.'}</p><div class="toolbar"><button class="primary-btn" data-action="friend-recalculate">${C.shareRecalculate}</button></div><div class="notice"><strong>조건을 새로 입력합니다</strong><span>${C.shareRecalculatePrivacy}</span></div><div class="notice warning">${C.shareLocalOnly}</div>`);

  function loadSharedCardFromHash() {
    if(location.hash==='#progress'){state.devDashboardOpen=true;return false;}
    if(!location.hash.startsWith('#share='))return false;
    try{
      const payload=safeSharedPayload(decodeShare(location.hash.slice(7)));

      state.sharePayload=payload;state.friendVote=safeRead(SHARE_VOTE_KEY,{})[shareKey(payload)]||null;state.route='friend-card';

  function decisionRow(d) {
    const usage = decisionUsage(d);
    const followUp = d.follow_up ? retentionCore.presentFollowUp(d.follow_up) : null;
    const observed = d.data_observed_at && !Number.isNaN(Date.parse(d.data_observed_at)) ? new Date(d.data_observed_at).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}) : '자료 확인 시각 없음';
    return `<article class="decision" data-decision="${escapeHtml(d.id)}"><div class="decision-main"><h3>${escapeHtml(d.name)}</h3><p class="muted">${escapeHtml(d.brand)} · ${new Date(d.selected_at).toLocaleDateString('ko-KR')} · ${d.data_mode === 'synthetic' ? '테스트 데이터' : '제한 데이터'}</p><small class="decision-observed" data-decision-observed="true">자료 확인 시각 · ${escapeHtml(observed)}${d.data_source ? ` · ${escapeHtml(d.data_source)}` : ''}</small>${usage ? `<small>저장 당시 사용법 v${escapeHtml(d.usage_version || 1)} · ${escapeHtml(usage.title)}</small>` : ''}${followUp ? retentionSummary(d,followUp) : ''}</div><div class="decision-actions">${usage ? `<button class="secondary-btn" data-action="decision-usage" data-decision="${escapeHtml(d.id)}">사용법 다시 보기</button><button class="secondary-btn" data-action="decision-guide" data-decision="${escapeHtml(d.id)}">첫 7일</button>` : ''}${followUp && ['due','late'].includes(followUp.timing) ? `<button class="primary-btn" data-action="retention-review" data-decision="${escapeHtml(d.id)}">${followUp.timing==='late'?'늦은 회고 남기기':'7~21일 회고'}</button>` : ''}${followUp && followUp.timing!=='completed' ? `<button class="ghost-btn" data-action="retention-preference" data-decision="${escapeHtml(d.id)}" data-preference="${followUp.preference_state==='muted'?'active':'muted'}">${followUp.preference_state==='muted'?'회고 알림 켜기':'회고 알림 끄기'}</button>` : ''}</div></article>`;
  }

  function retentionSummary(decision, followUp) {
    const change = followUp.price.change_won == null ? '가격 변화 확인 불가'
      : followUp.price.change_won > 0 ? `${won(followUp.price.change_won)} 낮아진 설정`
        : followUp.price.change_won < 0 ? `${won(Math.abs(followUp.price.change_won))} 높아진 설정` : '가격 변화 없음';
    const stock = followUp.stock.current === 'available' ? '구매 가능 설정' : followUp.stock.current === 'unavailable' ? '품절 설정' : '재고 확인 불가';
    const timing = followUp.timing === 'waiting' ? `${new Date(followUp.due_at).toLocaleDateString('ko-KR')}부터 회고 가능`
      : followUp.timing === 'due' ? '지금 7~21일 회고 가능' : followUp.timing === 'late' ? '21일이 지났지만 회고 보존' : '회고 완료';
    const source = decision.follow_up_source === 'remote' ? '로그인 서버 동기화' : '기기 내 합성 회고';
    return `<section class="retention-summary" data-retention-card="${escapeHtml(decision.id)}" data-timing="${followUp.timing}"><div class="retention-heading"><strong>가격·재고 다시 보기</strong><span class="retention-source">${source}</span></div><p>${followUp.price.at_decision == null ? '선택 당시 가격 없음' : `선택 당시 ${won(followUp.price.at_decision)}`} → ${followUp.price.current == null ? '현재 가격 없음' : `현재 ${won(followUp.price.current)}`} · ${change}</p><p>${stock} · <strong>${timing}</strong>${followUp.preference_state==='muted'?' · 알림 꺼짐':''}</p><small>화면 검증용 합성 가격·재고입니다. 실제 변동이나 구매 가능성을 뜻하지 않습니다.</small></section>`;
  }

  const retentionReasonLabels = {
    texture_match:'사용감이 잘 맞았어요', texture_mismatch:'사용감이 불편했어요', effect_match:'기대와 비슷했어요',
    effect_unclear:'변화를 판단하기 어려워요', irritation_concern:'불편 신호가 걱정됐어요', price_value:'가격 대비 괜찮았어요',
    availability_problem:'구매하기 어려웠어요', other_without_text:'그 밖의 선택형 이유',
  };

  function preferenceFingerprintView() {
    const fingerprint = currentFingerprint();
    if (!fingerprint.sample_count) return '';
    const textureLabels = {light:'산뜻하고 가벼운 사용감',balanced:'중간 사용감',rich:'촉촉하고 리치한 사용감'};
    const signals = [];
    if (fingerprint.top_texture) signals.push(`${textureLabels[fingerprint.top_texture.key]} +${fingerprint.top_texture.weight}`);
    if (fingerprint.top_concern) signals.push(`${label(fingerprint.top_concern.key)} 목적 +${fingerprint.top_concern.weight}`);
    if (fingerprint.value) signals.push(`가격 대비 만족 +${fingerprint.value}`);
    if (fingerprint.availability) signals.push(`구매 가능성 중요 +${fingerprint.availability}`);
    if (fingerprint.caution) signals.push(`근거 상태 주의 +${fingerprint.caution}`);
    return `<section class="notice preference-fingerprint" data-preference-fingerprint="${fingerprint.sample_count}"><strong>내 취향 지문 · 회고 ${fingerprint.sample_count}건</strong><span>${signals.length?signals.map(escapeHtml).join(' · '):'아직 다음 추천을 바꿀 만큼 분명한 신호가 없어요.'}</span><small>선택형 회고만 합성 데이터 안에서 반영합니다. 피부 상태나 건강을 추론하지 않으며, 언제든 결정 JSON으로 내보낼 수 있어요.</small></section>`;
  }

  function retentionReviewView() {
    const decision = state.decisions.find((item) => item.id === state.reviewDecisionId);
    const followUp = decision?.follow_up ? retentionCore.presentFollowUp(decision.follow_up) : null;
    if (!decision || !followUp) return libraryView();
    if (followUp.timing === 'waiting') return layout(`${sectionHead('아직 회고 전이에요',`${new Date(followUp.due_at).toLocaleDateString('ko-KR')}부터 선택형 회고를 남길 수 있어요.`,'library')}<div class="notice">입력한 내용은 사라지지 않았고, 첫 7일 가이드는 지금 다시 볼 수 있어요.</div>`);
    if (followUp.timing === 'completed') return layout(`${sectionHead('회고를 저장했어요',`${decision.name}의 선택형 회고는 한 번만 보존합니다.`,'library')}<div class="notice">${followUp.feedback?.timing==='late'?'21일 이후의 늦은 회고로 구분해 보존했어요.':'7~21일 회고로 보존했어요.'}</div>`);
    return layout(`${sectionHead('7~21일 결정 회고',`${decision.name} · 자유문장 없이 가까운 경험만 선택해요.`,'library')}${followUp.timing==='late'?'<div class="notice warning"><strong>21일이 지났어요</strong><span>늦은 의견도 버리지 않고 별도로 구분해 보존합니다.</span></div>':''}<form id="retention-form" class="form-card" data-decision="${escapeHtml(decision.id)}"><fieldset><legend>전체적으로 어땠나요?</legend><label><input type="radio" name="outcome" value="satisfied" required> 만족했어요</label><label><input type="radio" name="outcome" value="mixed"> 반반이에요</label><label><input type="radio" name="outcome" value="not_satisfied"> 만족하지 않았어요</label></fieldset><fieldset><legend>가까운 이유 1~3개</legend><div class="review-reasons">${Object.entries(retentionReasonLabels).map(([value,text])=>`<label><input type="checkbox" name="reason" value="${value}"> ${text}</label>`).join('')}</div></fieldset><fieldset><legend>다시 고르겠어요?</legend><label><input type="radio" name="choose_again" value="true" required> 네</label><label><input type="radio" name="choose_again" value="false"> 아니요</label></fieldset><button class="primary-btn wide" type="submit">선택형 회고 저장</button><p class="muted">피부·건강 자유문장은 수집하지 않습니다. 합성 Alpha에서는 기기 저장이 기본이며 서버 연결 시 로그인 사용자 계약으로 동기화합니다.</p></form>`);
  }

  function firstSevenDayView() {
    const decision = state.decisions.find((item) => item.id === state.guideDecisionId);
    const card = decisionUsage(decision);
    if (!decision || !card) return libraryView();
    const amount = usageAmount(card);
    return layout(`${sectionHead(C.firstSevenDays,`${decision.name} · 합성 테스트 상품`,'library')}<div class="notice warning usage-review"><strong>${C.usageReviewNotice}</strong><span>효과를 판정하는 일정이 아니라, 하나씩 안전하게 써 보고 불편을 기록하는 가이드입니다.</span></div><article class="seven-day-guide" data-first-seven-guide="${escapeHtml(decision.id)}"><div class="guide-product"><span class="role">저장 당시 사용법 v${escapeHtml(decision.usage_version || 1)}</span><h3>${escapeHtml(card.title)}</h3><p>${escapeHtml(card.body.routine_position)}</p></div><ol class="guide-timeline"><li class="guide-phase"><strong>1일</strong><div><h3>표시사항과 중단 기준부터</h3><p>${escapeHtml(card.body.label_priority)} 기존 루틴에 이 제품 하나만 추가해 보세요.</p></div></li><li class="guide-phase"><strong>2~3일</strong><div><h3>같은 방식으로 단순하게</h3><p>${escapeHtml(amount)} 불편 신호가 생기면 참지 말고 사용을 멈춥니다.</p></div></li><li class="guide-phase"><strong>4~7일</strong><div><h3>효과 단정 없이 사용 경험 회고</h3><p>편했음 · 복잡했음 · 사용감 불편 · 변화 판단 어려움 중 가까운 경험을 기록해 두세요.</p></div></li></ol><div class="notice warning"><strong>불편 신호</strong><span>${escapeHtml(card.body.safety_note)}</span></div><div class="toolbar"><button class="secondary-btn" data-action="decision-usage" data-decision="${escapeHtml(decision.id)}">전체 사용법과 근거</button><button class="ghost-btn" data-action="library">내 결정으로 돌아가기</button></div></article>`);
  }

  function libraryDecisions() {
    const query = normalizeSearchQuery(state.libraryQuery || '');
    return state.decisions.filter((decision) => {
      const haystack = normalizeSearchQuery([decision.name,decision.brand,decision.metadata?.concern,...(decision.reasons || [])].join(' '));
      if (query && !haystack.includes(query)) return false;
      if (state.libraryFilter === 'repurchase') return decision.metadata?.repurchase === 'yes';
      if (state.libraryFilter === 'in_use') return ['testing','using'].includes(decision.metadata?.usage_period);
      if (state.libraryFilter === 'recent') return Date.now() - Date.parse(decision.selected_at) < 30*24*60*60*1000;
      return true;
    });
  }

  function decisionMetadataForm(decision) {
    const metadata = decision.metadata || { usage_period:'not_started', repurchase:'undecided' };
    return `<details class="decision-metadata" data-decision-metadata="${escapeHtml(decision.id)}"><summary>사용·재구매 기록</summary><form data-decision-metadata-form="${escapeHtml(decision.id)}"><label>사용 상태<select name="usage_period"><option value="not_started"${metadata.usage_period==='not_started'?' selected':''}>아직 시작 전</option><option value="testing"${metadata.usage_period==='testing'?' selected':''}>테스트 중</option><option value="using"${metadata.usage_period==='using'?' selected':''}>사용 중</option><option value="stopped"${metadata.usage_period==='stopped'?' selected':''}>사용 중단</option></select></label><label>재구매 의향<select name="repurchase"><option value="undecided"${metadata.repurchase==='undecided'?' selected':''}>아직 모르겠어요</option><option value="yes"${metadata.repurchase==='yes'?' selected':''}>다시 고를래요</option><option value="no"${metadata.repurchase==='no'?' selected':''}>다른 선택을 볼래요</option></select></label><button class="secondary-btn" type="submit">기기에 저장</button></form></details>`;
  }

  function libraryView() {
    const records = libraryDecisions();
    const filterLabel = {all:'전체',recent:'최근 30일',in_use:'사용 중',repurchase:'재구매 의향'};
    return layout(`${sectionHead('내 결정','이 브라우저에 저장한 선택을 다시 찾고, 사용 경험을 짧게 남겨요.','home')}<div class="toolbar"><button class="secondary-btn" data-action="export">JSON 내보내기</button><label class="secondary-btn" for="import-file" role="button">JSON 가져오기</label><input id="import-file" class="visually-hidden" type="file" accept="application/json"><button class="ghost-btn" data-action="privacy">암호화 백업</button></div><form id="library-search-form" class="form-card" role="search"><label for="library-query">제품·브랜드·고민으로 찾기</label><div class="toolbar"><input id="library-query" name="query" value="${escapeHtml(state.libraryQuery)}" placeholder="예: 수분, 민감, 브랜드"><button class="secondary-btn" type="submit">찾기</button></div></form><div class="filter-row" aria-label="결정 기록 필터">${Object.entries(filterLabel).map(([value,labelText])=>`<button class="filter-chip${state.libraryFilter===value?' active':''}" data-action="library-filter" data-library-filter="${value}" aria-pressed="${state.libraryFilter===value}">${labelText}</button>`).join('')}</div>${preferenceFingerprintView()}${state.decisions.length ? `<p class="muted" data-library-result-count="true">${records.length}개 기록</p>${records.length ? `<div class="decision-list">${records.map((decision)=>`${decisionRow(decision)}${decisionMetadataForm(decision)}`).join('')}</div>` : '<div class="empty">조건에 맞는 기록이 없어요. 필터를 전체로 돌려보세요.</div>'}` : '<div class="empty">아직 저장한 결정이 없어요.</div>'}`);
  }

  function privacyView() {
    const online = state.online ? '연결됨' : '오프라인';
    const syncAvailable = Boolean(API_BASE);
    return layout(`${sectionHead('개인정보 선택권','기본값은 기기 안 저장입니다. 밖으로 보내는 일은 직접 켠 경우에만 가능해요.','method')}<section class="method-grid privacy-grid"><article><span>01</span><h3>기본 저장</h3><p>결정·회고·사용 기록은 로그인 없이 이 브라우저에 저장됩니다.</p></article><article><span>02</span><h3>동기화 선택</h3><p>${state.syncConsent ? '사용자가 선택한 동기화가 켜져 있습니다.' : '동기화는 꺼져 있습니다. 현재 어떤 기록도 서버로 보내지 않습니다.'}</p></article><article><span>03</span><h3>암호화 백업</h3><p>내가 정한 암호로 잠근 파일만 직접 내려받거나 가져올 수 있습니다. 암호는 저장하지 않습니다.</p></article><article><span>04</span><h3>오프라인</h3><p>현재 ${online} · ${state.online ? '연결이 없어져도 기기 안 추천과 기록은 계속됩니다.' : '원격 요청 없이 기기 안 비교·기록으로 계속하고 있습니다.'}</p></article></section><section class="form-card privacy-choice"><h2>선택 동기화</h2><p>서버 주소가 연결된 경우에도, 이 버튼을 직접 누르기 전에는 전송하지 않습니다.</p><button class="${state.syncConsent ? 'secondary-btn' : 'primary-btn'}" data-action="privacy-sync-toggle" aria-pressed="${state.syncConsent}">${state.syncConsent ? '선택 동기화 끄기' : '선택 동기화 켜기'}</button><p class="muted">${syncAvailable ? (state.online ? '켜면 새 결정·회고를 서버와 맞출 수 있습니다. 언제든 다시 끌 수 있습니다.' : '오프라인 중에는 동기화를 켜도 전송하지 않습니다. 연결이 돌아와도 사용자가 새 행동을 하기 전 자동 전송하지 않습니다.') : '현재 공개 알파에는 동기화 서버가 연결되어 있지 않아, 버튼을 켜도 외부 전송은 발생하지 않습니다.'}</p></section><section class="form-card encrypted-backup" data-encrypted-backup="true"><h2>암호화 백업</h2><p>백업 파일만 다른 기기로 옮기고, 암호는 파일·브라우저·서버 어디에도 저장하지 마세요.</p><div class="backup-fields"><label>새 백업 암호 <input id="backup-passphrase" type="password" autocomplete="new-password" minlength="12" placeholder="12자 이상"></label><label>암호 다시 입력 <input id="backup-passphrase-confirmation" type="password" autocomplete="new-password" minlength="12" placeholder="같은 암호"></label></div><button class="secondary-btn" data-action="encrypted-export">암호화 파일 만들기</button><hr><div class="backup-fields"><label>암호화 백업 파일 <input id="encrypted-import-file" type="file" accept="application/json,.aysbackup"></label><label>백업 암호 <input id="encrypted-import-passphrase" type="password" autocomplete="current-password" placeholder="백업을 만든 암호"></label></div><button class="ghost-btn" data-action="encrypted-import">암호화 파일 가져오기</button><p class="muted">암호 또는 파일이 틀리면 기존 기록을 바꾸지 않습니다. 선택 당시의 자료 확인 시각도 함께 보존됩니다.</p></section><section class="method-actions"><h2>기기 안 기록 관리</h2><div><button class="secondary-btn" data-action="pc-library">내 결정 열기</button><button class="ghost-btn" data-action="offline-help">오프라인에서 되는 일</button><button class="ghost-btn" data-action="method">자료 기준 보기</button></div></section>`);
  }

  function offlineView() {
    const status=state.online ? '연결됨' : '오프라인';
    return layout(`${sectionHead('오프라인에서도 이어가기','연결 상태가 바뀌어도 선택을 잃지 않도록, 되는 일과 기다려야 할 일을 나눠 보여드립니다.','privacy')}<section class="method-grid offline-guide" data-offline-guide="true"><article><span>01</span><h3>계속 되는 일</h3><p>기기에 저장된 후보 비교, 내 결정, 사용·재구매 기록, 암호화 백업은 ${status} 상태에서도 계속됩니다.</p></article><article><span>02</span><h3>기다리는 일</h3><p>실제 판매처 가격·재고 확인과 사용자가 켠 선택 동기화는 연결된 뒤에만 시도합니다.</p></article><article><span>03</span><h3>자동 전송 없음</h3><p>연결이 돌아와도 오프라인 동안 만든 기록을 자동으로 밖으로 보내지 않습니다.</p></article><article><span>04</span><h3>지금 상태</h3><p><strong data-offline-status-text="true">${status}</strong>${state.offlineSince ? ` · ${new Date(state.offlineSince).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}부터 기기 안 모드` : ''}</p></article></section><section class="method-actions"><h2>바로 이어가기</h2><div><button class="primary-btn" data-action="pc-start-quiz">기기 안 비교 시작</button><button class="secondary-btn" data-action="pc-library">내 결정 보기</button><button class="ghost-btn" data-action="privacy">개인정보 선택권</button></div></section>`);
  }

  function serviceRouteGroup() {
    if (['quiz','loading'].includes(state.route)) return 'decide';
    if (['candidates','compare','alternatives','card','share-preview','friend-card'].includes(state.route)) return 'compare';
    if (['bridge','barcode'].includes(state.route)) return 'find';
    if (['usage','usage-detail','decision-guide'].includes(state.route)) return 'usage';
    if (['library','retention-review'].includes(state.route)) return 'library';
    if (['method','privacy','offline-help'].includes(state.route)) return 'method';
    return 'home';
  }

  function serviceNavButton(action, labelText, group) {
    const current = serviceRouteGroup() === group;
    return `<button data-action="${action}"${current ? ' aria-current="page"' : ''}>${labelText}</button>`;
  }

  function header() {

  async function answerQuiz(value) {
    const q=questions[state.quizStep];
    state.answers[q.key]=value;
    track('quick_answer',{step:state.quizStep+1,answered:value==='unknown'?'skipped':'answered'});
    if (state.quizStep < questions.length-1) state.quizStep += 1;
    else {
      safeWrite('ays-alpha-draft',{answers:state.answers,quizStep:state.quizStep,route:'loading'});
      await loadCandidates('concern');
      return;
    }
    safeWrite('ays-alpha-draft',{answers:state.answers,quizStep:state.quizStep,route:state.route});
    render();
  }

  function makeIcon(size) {
    const canvas=document.createElement('canvas'); canvas.width=canvas.height=size;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#153e35'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#b8e04a'; ctx.beginPath(); ctx.arc(size*.5,size*.5,size*.34,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#153e35'; ctx.font=`900 ${Math.round(size*.28)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('AY',size*.5,size*.51);
    return canvas.toDataURL('image/png');
  }

  function setupManifest() {
    const manifest={name:'올영스캐너',short_name:'올영스캐너',description:'고르기 전에 이유부터 확인하는 뷰티 결정 서비스',start_url:'./',display:'standalone',background_color:'#f8f6ef',theme_color:'#123f34',icons:[{src:makeIcon(192),sizes:'192x192',type:'image/png'},{src:makeIcon(512),sizes:'512x512',type:'image/png'}]};
    const link=document.createElement('link'); link.rel='manifest'; link.href='data:application/manifest+json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(manifest)))); document.head.appendChild(link);
    const trustedLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ((location.protocol === 'https:' || trustedLocal) && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => toast('오프라인 설치 준비에 실패했어요. 앱은 계속 사용할 수 있어요.'));
  }

    ctx.fillStyle='#b8e04a'; ctx.font='700 34px sans-serif'; ctx.fillText('올영스캐너 테스트 결정 카드',80,110);
