  <title>올영스캐너 | 고르기 전에, 이유부터.</title>
  <style>:root {
  --bg: #f8f7f1;
  --surface: #ffffff;
  --primary: #153e35;
  --primary-2: #24584c;
  --accent: #b8e04a;
  --accent-soft: #eef8ce;
  --text: #17211e;
  --muted: #65716c;
  --line: #dce3de;
  --warning: #a94f1c;
  --warning-soft: #fff1e7;
  --shadow: 0 16px 44px rgba(21,62,53,.10);
  --radius: 20px;
  font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: var(--bg); }
button, input, select { font: inherit; }
button { min-height: 44px; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #5b8d00; outline-offset: 3px; }
main:focus { outline: 0; }

.decision-metadata { scroll-margin-top: 160px; scroll-margin-bottom: 260px; }
.skip { position: fixed; left: 12px; top: -80px; z-index: 100; background: #fff; color: var(--primary); padding: 12px; border-radius: 10px; }
.skip:focus { top: 12px; }
.shell { min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-left)); background: rgba(248,247,241,.94); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(21,62,53,.08); }
.brand { border: 0; background: none; color: var(--primary); font-weight: 900; letter-spacing: -.04em; font-size: 19px; padding: 6px 0; }
.top-spacer { flex: 1; }
.mode { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; background: var(--warning-soft); color: var(--warning); font-size: 12px; font-weight: 800; }
.mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.icon-btn { border: 1px solid var(--line); color: var(--primary); background: var(--surface); border-radius: 12px; padding: 7px 11px; font-weight: 800; }
.content { width: min(100%, 1040px); margin: 0 auto; padding: 26px 16px calc(110px + env(safe-area-inset-bottom)); }
.hero { padding: 22px 0 12px; }
.eyebrow { color: var(--primary-2); font-weight: 900; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; }
h1 { margin: 8px 0 10px; max-width: 760px; font-size: clamp(31px, 6vw, 60px); line-height: 1.03; letter-spacing: -.06em; }
h2 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 36px); letter-spacing: -.045em; }
h3 { margin: 0; font-size: 19px; letter-spacing: -.025em; }
p { line-height: 1.6; }
.muted { color: var(--muted); }
.actions-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 24px; }
.entry { min-height: 132px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: left; box-shadow: 0 5px 18px rgba(21,62,53,.04); }
.entry:hover { transform: translateY(-2px); border-color: var(--primary-2); box-shadow: var(--shadow); }
.entry.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.entry.usage-entry { grid-column: 1 / -1; min-height: 112px; background: linear-gradient(135deg,var(--accent-soft),#fff); border-color: #b7cc76; }
.entry .emoji { display: block; font-size: 27px; margin-bottom: 20px; }
.entry strong { display: block; font-size: 18px; }
.entry span:last-child { display: block; margin-top: 6px; opacity: .76; font-size: 13px; line-height: 1.45; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 13px 15px; margin: 14px 0; border-radius: 14px; background: var(--accent-soft); color: #34430e; font-size: 13px; line-height: 1.55; }
.notice strong { flex: 0 0 auto; white-space: nowrap; }
.notice.warning { background: var(--warning-soft); color: #7a3512; }
.section-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 22px; }
.section-head > div { flex: 1; }
.back { width: 44px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--primary); font-weight: 900; }
.progress { height: 7px; border-radius: 999px; overflow: hidden; background: #e7ebe8; margin: 20px 0 32px; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .25s ease; }
.why { margin: 8px 0 18px; border: 0; background: none; color: var(--primary-2); text-decoration: underline; padding: 0; min-height: 32px; }
.choices { display: grid; gap: 10px; }
.choice { padding: 15px 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); text-align: left; font-weight: 750; }
.choice:hover { border-color: var(--primary); background: #f3f8f5; }
.choice.skip { color: var(--muted); font-weight: 650; }
.cards { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; align-items: stretch; }
.card { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 7px 22px rgba(21,62,53,.05); }
.card.best { border: 2px solid var(--primary); box-shadow: var(--shadow); }
.role { align-self: flex-start; padding: 6px 9px; margin-bottom: 16px; border-radius: 999px; color: var(--primary); background: var(--accent-soft); font-size: 12px; font-weight: 900; }
.product-sub { color: var(--muted); font-size: 13px; margin: 5px 0 16px; }
.price { margin: 10px 0; font-size: 21px; font-weight: 900; letter-spacing: -.03em; }
.price small { color: var(--muted); font-size: 12px; font-weight: 650; }
.reason-list { padding-left: 19px; margin: 12px 0; line-height: 1.5; font-size: 14px; }
.caveat { padding: 10px 11px; border-radius: 12px; color: #703310; background: var(--warning-soft); font-size: 13px; line-height: 1.45; }
.candidate-entry-status { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 10px; padding:11px 13px; border:1px solid #c8d9d1; border-radius:12px; color:#145a3a; background:#f3faf5; font-size:13px; line-height:1.45; }
.candidate-entry-status strong { white-space:nowrap; font-weight:900; }
.candidate-entry-status span { color:#49705d; text-align:right; }
.confidence { margin: 12px 0 16px; color: var(--muted); font-size: 12px; font-weight: 800; }
.data-truth { margin: 0 0 16px; padding: 12px; border: 1px solid #c8d9d1; border-radius: 12px; background: #f6faf7; }
.data-truth-heading { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.data-truth-heading strong { color: var(--primary); font-size: 12px; }
.data-truth-heading span { color: #185b3c; font-size: 10px; font-weight: 850; }
.data-truth dl { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px 12px; margin: 0; }
.data-truth dl div { min-width: 0; }
.data-truth dt { margin-bottom: 2px; color: var(--muted); font-size: 10px; }
.data-truth dd { margin: 0; color: var(--text); font-size: 11px; font-weight: 750; line-height: 1.35; overflow-wrap: anywhere; }
.data-truth dd small { display: block; color: var(--muted); font-size: 10px; font-weight: 600; }
.market-availability { display:grid; gap:10px; margin:0 0 16px; padding:14px; border:1px solid #efd39c; border-radius:12px; color:#5e4918; background:#fffaf0; }
.market-availability header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.market-availability header strong,.market-availability header span { display:block; }
.market-availability header strong { color:#6a4a00; font-size:13px; }
.market-availability header span { margin-top:2px; color:#8b6100; font-size:10px; font-weight:850; }
.market-availability header small { color:#806b36; font-size:10px; font-weight:800; }
.market-availability dl { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0; }
.market-availability dl div { min-width:0; padding:8px; border:1px solid #f2dfb7; border-radius:8px; background:rgba(255,255,255,.7); }
.market-availability dt { margin-bottom:2px; color:#806b36; font-size:10px; }
.market-availability dd,.market-availability p { margin:0; font-size:11px; font-weight:750; line-height:1.4; overflow-wrap:anywhere; }
.product-truth-inline { margin: 0 0 12px; color: var(--muted); font-size: 10px; line-height: 1.4; }
.product-truth-inline strong { color: var(--primary-2); }
.market-context select { min-height: 34px; max-width: 112px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--primary); padding: 5px 8px; font-size: 11px; font-weight: 800; }
.card-actions { display: grid; gap: 8px; margin-top: auto; }
.primary-btn, .secondary-btn, .ghost-btn { border-radius: 13px; padding: 12px 14px; font-weight: 850; }
.primary-btn { border: 1px solid var(--primary); background: var(--primary); color: #fff; }
.secondary-btn { border: 1px solid var(--primary); background: var(--surface); color: var(--primary); }
.ghost-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); }
.wide { width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 9px; margin: 20px 0; }
.compare-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.compare { width: 100%; min-width: 680px; border-collapse: collapse; }
.compare th, .compare td { padding: 15px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.45; }
.compare th:first-child { position: sticky; left: 0; z-index: 2; width: 145px; background: #f3f6f3; }
.compare thead th { background: #f3f6f3; }
.form-card { max-width: 700px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.input-row { display: flex; gap: 10px; }
input[type="search"], input[type="text"] { width: 100%; min-height: 48px; border: 1px solid #aab7b1; border-radius: 13px; background: #fff; padding: 12px 14px; color: var(--text); }
.fingerprint { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 9px; margin: 18px 0; }
.fingerprint div { padding: 12px; background: #f2f5f2; border-radius: 12px; }
.fingerprint small { display: block; color: var(--muted); margin-bottom: 4px; }
.purpose-chips { display: flex; gap: 8px; overflow-x: auto; padding: 3px 1px 12px; }
.purpose { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--primary); padding: 9px 13px; }
.purpose.active { background: var(--primary); color: #fff; }
.alt-list, .decision-list { display: grid; gap: 10px; }
.alt, .decision { display: flex; gap: 12px; align-items: center; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
.alt > div, .decision > div { flex: 1; }
.delta { color: var(--primary-2); font-weight: 850; font-size: 13px; }
.share-card { max-width: 620px; padding: 28px; border-radius: 26px; color: #fff; background: linear-gradient(145deg,#153e35,#24584c); box-shadow: var(--shadow); }
.share-card .role { background: var(--accent); color: #203000; }
.share-card h2 { margin-top: 15px; }
.share-card ul { padding-left: 20px; line-height: 1.65; }
.vote-grid { grid-template-columns: repeat(2,minmax(0,1fr)); margin: 18px 0; }
.share-choice { border-top: 5px solid var(--accent); }
.share-choice .wide { margin-top: auto; }
.local-vote-result { padding: 12px 14px; border-radius: 13px; background: #eef6d9; color: var(--primary); font-weight: 750; }
#share-link { font-size: 12px; }
.storage-bar { position: relative; z-index: 40; width: min(calc(100% - 24px),720px); margin: -92px auto 18px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.96); box-shadow: var(--shadow); font-size: 12px; color: var(--muted); }
.storage-bar strong { color: var(--text); }
.storage-dot { width: 9px; height: 9px; border-radius: 50%; background: #39875a; }
.storage-bar.memory { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); width: min(calc(100% - 24px),720px); margin: 0; transform: translateX(-50%); }
.storage-bar.memory .storage-dot { background: var(--warning); }
#toast { position: fixed; left: 50%; bottom: 88px; z-index: 80; transform: translate(-50%,20px); opacity: 0; pointer-events: none; max-width: calc(100% - 32px); padding: 11px 15px; border-radius: 12px; background: #17211e; color: #fff; transition: .2s; }
#toast.show { transform: translate(-50%,0); opacity: 1; }
.empty { padding: 32px; text-align: center; border: 1px dashed #aab7b1; border-radius: var(--radius); color: var(--muted); }
.footer-note { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.usage-review { justify-content: space-between; }
.usage-starts { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 10px; margin: 14px 0 30px; }
.usage-start { min-height: 132px; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); text-align: left; }
.usage-start:hover { border-color: var(--primary-2); background: #f3f8f5; }
.usage-start strong, .usage-start span { display: block; }
.usage-start strong { color: var(--primary); line-height: 1.35; }
.usage-start span { margin-top: 9px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.usage-controls { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.usage-controls form { margin-top: 14px; }
.usage-controls label { display: block; margin-bottom: 8px; }
.usage-filters { display: flex; gap: 8px; overflow-x: auto; padding: 14px 1px 2px; }
.usage-count { margin: 20px 0 10px; color: var(--muted); }
.usage-count strong { color: var(--primary); }
.usage-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
.usage-card { display: flex; flex-direction: column; min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
.usage-card h3 { margin-top: 12px; }
.usage-card > p { color: var(--muted); font-size: 13px; }
.usage-card .wide { margin-top: auto; }
.usage-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.usage-meta span { padding: 5px 8px; border-radius: 999px; background: #edf3ef; color: var(--primary-2); font-size: 11px; font-weight: 850; }
.usage-answer { padding: 11px; border-radius: 12px; background: var(--accent-soft); color: #34430e !important; }
.usage-answer strong { display: block; margin-bottom: 4px; }
.usage-detail { max-width: 820px; padding: clamp(18px,4vw,34px); border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
.usage-lead { margin: 20px 0; font-size: clamp(21px,4vw,30px); font-weight: 850; line-height: 1.4; letter-spacing: -.035em; }
.usage-fields { display: grid; gap: 8px; margin: 20px 0 28px; }
.usage-fields div { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: #f3f6f3; }
.usage-fields dt { color: var(--primary); font-weight: 850; }
.usage-fields dd { margin: 0; line-height: 1.55; }
.usage-steps { display: grid; gap: 10px; padding: 0; list-style: none; counter-reset: usage-step; }
.usage-steps li { position: relative; padding: 16px 16px 16px 54px; border: 1px solid var(--line); border-radius: 15px; counter-increment: usage-step; }
.usage-steps li::before { content: counter(usage-step); position: absolute; left: 16px; top: 16px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 900; }
.usage-steps p { margin: 8px 0; }
.usage-steps small, .stop-signal { display: block; line-height: 1.5; }
.usage-steps small { color: var(--muted); }
.stop-signal { margin-top: 8px; color: var(--warning); }
.source-list { display: grid; gap: 9px; padding-left: 20px; }
.source-list a { color: var(--primary-2); font-weight: 750; }
.source-list small { display: block; margin-top: 3px; color: var(--muted); }
.product-usage-summary { display: grid; gap: 7px; margin: 16px 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--accent-soft); }
.product-usage-summary div { display: grid; grid-template-columns: 82px 1fr; gap: 8px; }
.product-usage-summary dt { color: var(--muted); font-size: .82rem; font-weight: 800; }
.product-usage-summary dd { margin: 0; font-size: .88rem; line-height: 1.45; }
.product-usage-context { border-color: var(--primary-2); }
.decision-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.decision-actions button { min-height: 40px; }
.decision-main { min-width: 0; }
.retention-summary { margin-top: 14px; padding: 14px; border: 1px solid #c8d9d1; border-radius: 14px; background: #f3f8f5; }
.retention-summary p { margin: 7px 0; line-height: 1.5; }
.retention-summary small { display: block; color: var(--muted); line-height: 1.45; }
.retention-heading { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.retention-source { padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: #34430e; font-size: 11px; font-weight: 850; }
#retention-form { display: grid; gap: 18px; }
#retention-form fieldset { display: grid; gap: 9px; margin: 0; padding: 15px; border: 1px solid var(--line); border-radius: 14px; }
#retention-form legend { padding: 0 7px; color: var(--primary); font-weight: 900; }
#retention-form label { display: flex; gap: 8px; align-items: flex-start; line-height: 1.45; }
.review-reasons { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
.seven-day-guide { display: grid; gap: 18px; }
.guide-product { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.guide-product h3 { margin: 10px 0 6px; }
.guide-product p { margin: 0; color: var(--muted); }
.guide-timeline { display: grid; gap: 12px; padding: 0; list-style: none; }
.guide-phase { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.guide-phase > strong { align-self: start; padding: 7px 9px; border-radius: 999px; background: var(--primary); color: #fff; text-align: center; }
.guide-phase h3 { margin: 3px 0 7px; }
.guide-phase p { margin: 0; line-height: 1.6; }
.pc-home-v2, .pc-desk, .pc-shortcut-hint, .pc-workbench, .pc-handoff-dock, .pc-shortcut-panel { display: none; }
@media (min-width: 1024px) {
  .topbar { padding-inline: max(32px, calc((100vw - 1440px) / 2)); }
  .content { width: min(calc(100% - 64px),1440px); padding-top: 36px; }
  .content:has(> .pc-desk) { display: grid; grid-template-columns: minmax(0,2.45fr) minmax(300px,.8fr); column-gap: 24px; align-items: start; }
  .content:has(> .pc-desk) > :not(.pc-desk) { grid-column: 1; }
  .mobile-home-legacy { display: none; }
  .pc-home-v2 { display: flex; flex-direction: column; min-width: 0; }
  .actions-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .entry.usage-entry { grid-column: 2 / -1; }
  .pc-home-nav { display: flex; gap: 6px; margin: -12px 0 22px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .pc-home-nav button { min-height: 36px; padding: 7px 13px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 800; }
  .pc-home-nav button[aria-current="page"], .pc-home-nav button:hover { color: var(--primary); background: var(--accent-soft); }
  .pc-home-hero { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(290px,.8fr); gap: 26px; align-items: end; padding: 26px 28px; border: 1px solid #ccdbd3; border-radius: 28px; background: radial-gradient(circle at 92% 8%,rgba(184,224,74,.28),transparent 30%),linear-gradient(135deg,#fff,#f1f7f3); box-shadow: 0 12px 34px rgba(21,62,53,.07); }
  .pc-home-hero h1 { max-width: 720px; margin: 8px 0 10px; font-size: clamp(38px,3.9vw,60px); line-height: 1.02; }
  .pc-home-hero p { margin: 0; color: var(--muted); }
  #pc-home-search { padding: 16px; border: 1px solid rgba(21,62,53,.15); border-radius: 18px; background: rgba(255,255,255,.86); }
  #pc-home-search label { display: block; margin-bottom: 8px; color: var(--primary); font-size: 13px; font-weight: 900; }
  #pc-home-search small { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; }
  .pc-home-search-box { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .pc-home-search-box input { min-width: 0; }

  .pc-handoff-dock { position: fixed; z-index: 20; right: 18px; bottom: 58px; display: grid; grid-template-columns: 84px minmax(150px,1fr); gap: 12px; width: 292px; padding: 12px; border: 1px solid #bdcec5; border-radius: 18px; background: rgba(255,255,255,.96); box-shadow: 0 16px 38px rgba(19,59,46,.2); backdrop-filter: blur(12px); }

  .pc-handoff-dock button { margin-top: 3px; padding: 6px 8px; font-size: 11px; }

  .pc-shortcut-panel > div { width: min(460px,100%); padding: 28px; border-radius: 24px; background: #fff; box-shadow: var(--shadow); }
  .pc-shortcut-panel dl { display: grid; gap: 10px; margin: 18px 0; }

  .pc-shortcut-panel dt { color: var(--primary); font-weight: 900; }
  .pc-shortcut-panel dd { margin: 0; color: var(--muted); }
  .pc-shortcut-hint { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; padding: 12px 14px; border: 1px solid #c8d9d1; border-radius: 14px; background: #f3f8f5; color: var(--primary); font-size: 13px; }

  .cards { gap: 20px; }

@media (max-width: 1023px) {

}
@media (max-width: 760px) {

  .mode { order: 3; width: 100%; justify-content: center; }
  .content { padding-top: 18px; }
  .actions-grid, .cards { grid-template-columns: 1fr; }
  .vote-grid { grid-template-columns: 1fr; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }

/* Service design v2 — one visual system across every route */
:root {
  --bg: #f8f6ef;
  --surface: #fffefa;
  --primary: #123f34;
  --primary-2: #216151;
  --primary-3: #2f7764;
  --accent: #c7ed43;
  --accent-soft: #eef8cf;
  --jade: #dcefe7;
  --jade-2: #c8e4d8;
  --coral: #f7c6b5;
  --warning-soft: #fff0e9;
  --text: #17201d;
  --muted: #68736f;
  --line: #d8e0da;
  --line-strong: #bfcfc6;
  --shadow: 0 18px 55px rgba(18,63,52,.11);
  --shadow-soft: 0 8px 28px rgba(18,63,52,.07);
  --radius: 22px;
}
body {
  color: var(--text);
  background:
    radial-gradient(circle at 8% 12%,rgba(199,237,67,.09),transparent 23rem),
    radial-gradient(circle at 90% 35%,rgba(220,239,231,.42),transparent 32rem),
    var(--bg);
}
body::selection { color: #fff; background: var(--primary-2); }
.service-shell { overflow: clip; }
.service-status-strip {
  position: relative;
  z-index: 42;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  min-height: 34px;
  padding: 6px 18px;
  color: #eaf3ef;
  background: #0c3028;
  font-size: 11px;
  letter-spacing: .01em;
}
.service-status-strip span:first-child { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; }
.service-status-strip i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(199,237,67,.13); }
.service-status-strip button { min-height: 24px; padding: 0; border: 0; color: var(--accent); background: transparent; font-size: 11px; font-weight: 850; text-decoration: underline; text-underline-offset: 3px; }
.service-header {
  top: 0;
  display: block;
  padding: 0;
  color: var(--text);
  background: rgba(255,254,250,.96);
  border-bottom: 1px solid rgba(18,63,52,.12);
  backdrop-filter: blur(18px);
}
.service-header-main,
.service-header-nav {
  width: min(calc(100% - 48px),1360px);
  margin-inline: auto;
  display: flex;
  align-items: center;
}
.service-header-main { min-height: 72px; gap: 24px; }
.service-header-nav { min-height: 44px; justify-content: space-between; border-top: 1px solid rgba(18,63,52,.08); }
.brand { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 10px; text-align: left; }
.brand-seal {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  overflow: hidden;
  border: 2px solid currentColor;
  border-radius: 50% 50% 46% 54%;
  color: var(--primary);
  background: var(--accent);
  font: 950 19px/1 Georgia,serif;
  transform: rotate(-6deg);
}
.brand-copy { display: grid; }
.brand-copy strong { color: var(--primary); font-size: 18px; letter-spacing: -.05em; }
.brand-copy small { color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .15em; }
.global-search {
  position: relative;
  flex: 1 1 520px;
  max-width: 660px;
}
.global-search input {
  height: 46px;
  padding: 11px 76px 11px 18px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: #f7f8f4;
}
.global-search input:focus { border-color: var(--primary-2); background: #fff; box-shadow: 0 0 0 4px rgba(33,97,81,.1); }
.global-search button {
  position: absolute;
  top: 4px;
  right: 5px;
  min-height: 38px;
  padding: 7px 18px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: var(--primary);

.header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.saved-btn { display: inline-flex; align-items: center; gap: 8px; }

.global-nav::-webkit-scrollbar { display: none; }
.global-nav button {
  position: relative;
  flex: 0 0 auto;
  min-height: 43px;
  padding: 9px 14px;
  border: 0;

  position: absolute;

  right: 14px;
  bottom: 0;
  height: 3px;
  border-radius: 999px 999px 0 0;

.handoff-header-btn {
  flex: 0 0 auto;
  min-height: 32px;
  border: 0;
  color: var(--primary-2);
  background: transparent;
  font-size: 11px;
  font-weight: 800;

.handoff-header-btn kbd { margin-left: 5px; padding: 3px 6px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; background: #fff; }
.service-content {
  width: min(calc(100% - 40px),1360px);

  padding-bottom: 56px;

.service-content > .section-head:first-child { margin-top: 10px; }
.primary-btn,.secondary-btn,.ghost-btn { border-radius: 12px; transition: transform .18s ease,box-shadow .18s ease,background .18s ease; }
.primary-btn:hover,.secondary-btn:hover,.ghost-btn:hover { transform: translateY(-1px); }
.primary-btn { box-shadow: 0 8px 20px rgba(18,63,52,.15); }
.secondary-btn:hover { background: var(--accent-soft); }
.ghost-btn:hover { color: var(--primary); border-color: var(--line-strong); background: #fff; }
.category-rail {

  gap: 4px;
  align-items: center;
  margin: -10px 0 18px;
  padding: 0;
  border: 0;
  overflow-x: auto;

.service-home { display: flex; flex-direction: column; }
.service-home > .category-rail { order: 0; }
.service-home > .service-hero { order: 1; }
.service-home > .pc-discovery { order: 2; }
.service-home > .pc-home-actions { order: 3; }
.service-home > .service-concerns { order: 4; }
.service-home > .service-data-notice { order: 5; }

.category-rail > span { flex: 0 0 auto; margin-right: 8px; color: var(--muted); font-size: 11px; font-weight: 850; }
.category-rail button {

  min-height: 34px;
  padding: 6px 12px;
  border: 1px solid transparent;
  border-radius: 999px;
  color: var(--primary);
  background: transparent;
  font-size: 12px;
  font-weight: 800;

.service-hero {
  position: relative;
  min-height: 350px;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0,1.15fr) minmax(330px,.85fr);
  gap: clamp(24px,4vw,64px);

  padding: clamp(30px,4vw,58px);

  color: #fff;

    radial-gradient(circle at 85% 18%,rgba(199,237,67,.34),transparent 15rem),

  position: absolute;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;

.service-hero::before { width: 360px; height: 360px; right: -145px; top: -170px; }
.service-hero::after { width: 220px; height: 220px; right: 240px; bottom: -170px; }
.hero-copy { position: relative; z-index: 1; }
.hero-copy .eyebrow { color: var(--accent); }
.hero-copy h1 { margin: 8px 0 14px; max-width: 620px; color: #fff; font-size: clamp(46px,5vw,74px); line-height: .98; }
.hero-copy h1 em { color: var(--accent); font-family: Georgia,"Times New Roman",serif; font-weight: 500; letter-spacing: -.07em; }

.hero-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }

.hero-proof strong { color: #fff; font-size: 17px; }
.hero-search-stage {
  position: relative;
  z-index: 1;
  padding: 24px;
  border: 1px solid rgba(255,255,255,.34);
  border-radius: 24px;

  background: rgba(255,254,250,.96);
  box-shadow: 0 18px 55px rgba(0,0,0,.18);

.stage-index { display: block; margin-bottom: 20px; color: var(--primary-2); font-size: 10px; font-weight: 900; letter-spacing: .13em; }
.hero-search-stage label { display: block; color: var(--text); font-size: 22px; font-weight: 900; letter-spacing: -.035em; }
.hero-search-stage > p { margin: 5px 0 15px; color: var(--muted); font-size: 12px; }
.hero-search-stage small { display: block; margin-top: 12px; color: var(--muted); font-size: 10px; }
.pc-home-search-box { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px; }
.search-examples { display: flex; gap: 5px; overflow-x: auto; margin-top: 10px; }
.search-examples button { flex: 0 0 auto; min-height: 29px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--primary-2); background: #f8faf7; font-size: 10px; font-weight: 800; }
.pc-home-actions { margin: 14px 0 54px; }
.pc-home-actions .entry {
  position: relative;
  min-height: 126px;
  padding: 20px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 19px;
  background: rgba(255,254,250,.94);
  box-shadow: var(--shadow-soft);

  .header-actions { order: 2; }
  .global-search { order: 3; flex-basis: 100%; max-width: none; }
  .service-header-nav { overflow: hidden; }
  .global-nav { flex: 1; }
  .handoff-header-btn { display: none; }
  .service-content { width: min(calc(100% - 28px),900px); padding-top: 18px; }
  .pc-home-v2,.pc-desk,.pc-workbench,.pc-handoff-dock { display: none; }
  .mobile-home-legacy { display: block; }
  .service-mobile-home { padding-bottom: 20px; }
  .mobile-hero { position: relative; overflow: hidden; padding: clamp(28px,8vw,58px); border-radius: 28px; color: #fff; background: linear-gradient(145deg,#113c32,#216151); }
  .mobile-hero::after { content: ""; position: absolute; width: 180px; height: 180px; right: -90px; top: -90px; border: 28px solid rgba(199,237,67,.18); border-radius: 50%; }
  .mobile-hero .eyebrow { color: var(--accent); }
  .mobile-hero h1 { position: relative; z-index: 1; margin: 8px 0 12px; color: #fff; font-size: clamp(42px,10vw,68px); line-height: .98; }
  .mobile-hero h1 em { color: var(--accent); font-family: Georgia,serif; font-weight: 500; }
  .mobile-hero p { max-width: 520px; color: #d5e4dd; }
  .mobile-hero .primary-btn { position: relative; z-index: 1; margin-top: 14px; color: #183126; border-color: var(--accent); background: var(--accent); }
  .mobile-search-prompt { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin: 12px 0 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: var(--shadow-soft); }
  .mobile-search-prompt button { min-height: 32px; border: 0; color: var(--primary); background: transparent; font-size: 11px; font-weight: 900; }
  .mobile-service-actions { margin-top: 0; }
  .mobile-service-actions .entry { position: relative; min-height: 135px; padding: 17px; overflow: hidden; }
  .mobile-service-actions .entry-index { margin-bottom: 20px; }
  .mobile-service-actions .usage-entry { grid-column: 1 / -1; }
  .mobile-curated { display: grid; gap: 7px; margin: 32px 0; }
  .mobile-curated > div { margin-bottom: 7px; }
  .mobile-curated button { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; min-height: 92px; padding: 15px; border: 1px solid var(--line); border-radius: 17px; color: var(--text); background: #fff; text-align: left; }
  .mobile-curated button > span { color: var(--primary-3); font-size: 9px; font-weight: 950; }
  .mobile-curated small,.mobile-curated strong,.mobile-curated p { display: block; }
  .mobile-curated small { color: var(--muted); font-size: 9px; }
  .mobile-curated p { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
  .mobile-curated i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--primary); background: var(--accent); font-style: normal; }
  .service-footer { width: min(calc(100% - 28px),900px); }
  .service-footer > section { display: grid; padding: 26px 22px 20px; }
  .footer-principles { justify-content: flex-start; }
  .service-footer > nav { padding: 22px; }
  .footer-legal { grid-template-columns: 1fr; gap: 10px; padding: 18px 22px 24px; }
  .method-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .method-hero { grid-template-columns: 1fr; }
  .method-ledger { grid-template-columns: 1fr; }
}
@media (max-width:760px) {
  .service-status-strip { font-size: 9px; }
  .service-status-strip button { font-size: 9px; }
  .brand-copy small,.install-btn,.header-actions .mode { display: none; }
  .brand-seal { width: 34px; height: 34px; }
  .global-nav button { padding-inline: 10px; font-size: 11px; }
  .service-content { width: calc(100% - 24px); }
  .mobile-service-actions { grid-template-columns: 1fr; }
  .mobile-service-actions .usage-entry { grid-column: auto; }
  .service-section-head { gap: 10px; }
  .service-section-head h1 { font-size: 38px; }
  .service-footer { width: calc(100% - 24px); border-radius: 22px; }
  .service-footer > nav { grid-template-columns: 1fr; gap: 18px; }
  .method-grid { grid-template-columns: 1fr; }
  .method-grid article { min-height: 190px; }
  .method-grid h3 { margin-top: 38px; }
  .method-actions { display: grid; }
  .method-actions div { display: grid; }
  .cards,.usage-grid { grid-template-columns: 1fr; }
  .usage-starts { grid-template-columns: 1fr; }
  .storage-bar { width: calc(100% - 24px); }
}

/* v0.11 — 검색 중심의 고밀도 서비스 UI */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --primary: #176b43;
  --primary-2: #128356;
  --primary-3: #149361;
  --accent: #19c37d;
  --accent-soft: #e9f8f1;
  --jade: #edf8f3;
  --jade-2: #dff3e9;
  --text: #202124;
  --muted: #666b72;
  --line: #e2e5e9;
  --line-strong: #cdd2d8;
  --warning: #a34d18;
  --warning-soft: #fff7ed;
  --shadow: 0 12px 32px rgba(24,32,38,.08);
  --shadow-soft: 0 3px 12px rgba(24,32,38,.055);
  --radius: 16px;
}
html { background: var(--bg); }
body {
  color: var(--text);
  background: var(--bg);
  font-family: Pretendard, "Noto Sans KR", Inter, system-ui, -apple-system, sans-serif;
  letter-spacing: -.012em;
}
body::selection { color: #fff; background: var(--primary-2); }
button { transition: color .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease; }
button:focus-visible,input:focus-visible,a:focus-visible { outline: 3px solid rgba(25,195,125,.32); outline-offset: 2px; }

.service-status-strip {
  min-height: 30px;
  justify-content: flex-start;
  gap: 12px;
  padding: 5px max(24px,calc((100vw - 1280px)/2));
  color: #555b61;
  background: #f8f9fa;
  border-bottom: 1px solid var(--line);
  font-size: 10px;
}
.service-status-strip span:first-child { color: #2f3438; }
.service-status-strip i { width: 6px; height: 6px; background: #f59f00; box-shadow: none; }
.service-status-strip button { margin-left: auto; color: var(--primary-2); font-size: 10px; text-decoration: none; }
.connection-bar { display:flex; align-items:center; gap:10px; padding:11px clamp(16px,4vw,54px); border-bottom:1px solid var(--line); font-size:12px; line-height:1.45; }
.connection-bar strong { flex:0 0 auto; }
.connection-bar span { flex:1; }
.connection-bar button { flex:0 0 auto; border:0; border-radius:999px; padding:7px 10px; font:inherit; font-weight:850; cursor:pointer; }
.connection-bar.offline { background:#fff4d9; color:#714b00; border-color:#f0ce83; }
.connection-bar.offline button { background:#714b00; color:#fff; }
.connection-bar.restored { background:#e8f6ec; color:#1d613d; border-color:#b6dfc1; }
.connection-bar.restored button { background:#1d613d; color:#fff; }

.service-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(20,28,34,.02);
  backdrop-filter: blur(18px) saturate(150%);
}
.service-header-main,.service-header-nav { width: min(calc(100% - 40px),1280px); }
.service-header-main { min-height: 68px; gap: 28px; }
.service-header-nav { min-height: 42px; border-top: 1px solid #f1f2f4; }
.brand { gap: 9px; }
.brand-seal {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(135deg,#16784d,#0d6540);
  box-shadow: 0 4px 12px rgba(16,166,103,.22);
  font: 900 15px/1 Pretendard,"Noto Sans KR",sans-serif;
  transform: none;
}
.brand-copy strong { color: #1f2327; font-size: 19px; font-weight: 900; letter-spacing: -.055em; }
.brand-copy small { margin-top: 2px; color: #62676d; font-size: 7px; letter-spacing: .13em; }
.global-search { max-width: 600px; }
.global-search input {
  height: 46px;
  padding: 10px 70px 10px 18px;
  border: 2px solid var(--accent);
  border-radius: 12px;
  color: #222;
  background: #fff;
  box-shadow: 0 3px 12px rgba(25,195,125,.07);
}
.global-search input::placeholder { color: #969ba1; }
.global-search input:focus { border-color: #0eaa69; box-shadow: 0 0 0 4px rgba(25,195,125,.12); }
.global-search button {
  top: 4px;
  right: 4px;
  min-width: 58px;
  height: 38px;
  border-radius: 9px;
  background: var(--primary);
  font-size: 12px;
}
.header-actions { gap: 6px; }
.header-actions .icon-btn,.header-actions .mode {
  min-height: 36px;
  border-radius: 9px;
  border-color: var(--line);
  background: #fff;
  font-size: 11px;
}
.header-actions .mode { color: #8a511c; background: var(--warning-soft); }
.saved-btn strong { color: #fff; background: var(--primary); }
.global-nav { gap: 0; }
.global-nav button { min-height: 41px; padding: 9px 16px; color: #5f646a; font-size: 13px; font-weight: 750; }
.global-nav button:hover { color: #111; background: #f7f8f9; }
.global-nav button[aria-current="page"] { color: #111; font-weight: 900; }
.global-nav button[aria-current="page"]::after { left: 16px; right: 16px; height: 3px; background: var(--accent); }

.service-content { width: min(calc(100% - 40px),1280px); padding-top: 22px; padding-bottom: 48px; }
.service-home > .service-hero { order: 0; }
.service-home > .category-rail { order: 1; }
.service-home > .pc-discovery { order: 2; }
.service-home > .pc-home-actions { order: 3; }
.service-home > .service-concerns { order: 4; }
.service-home > .service-data-notice { order: 5; }
.service-home > .service-bridge-feature { order: 6; }
.service-home > .service-evidence-grid { order: 7; }
.service-home > .service-usage-showcase { order: 8; }
.service-home > .pc-workbench { order: 9; }
.service-home > .service-trust-strip { order: 10; }

.service-hero {
  min-height: 282px;
  grid-template-columns: minmax(0,.9fr) minmax(440px,1.1fr);
  gap: 38px;
  padding: 36px 42px;
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--text);
  background:
    linear-gradient(90deg,rgba(234,249,241,.8),rgba(255,255,255,.1) 48%),
    #fff;
  box-shadow: var(--shadow-soft);
}
.service-hero::before { width: 240px; height: 240px; right: -130px; top: -145px; border: 46px solid rgba(25,195,125,.065); }
.service-hero::after { display: none; }
.hero-copy .eyebrow { margin: 0; color: var(--primary-2); font-size: 11px; letter-spacing: 0; text-transform: none; }
.hero-copy h1 { margin: 8px 0 12px; color: #17191c; font-size: clamp(36px,3.25vw,48px); line-height: 1.08; letter-spacing: -.065em; }
.hero-copy h1 em { color: var(--primary-2); font-family: inherit; font-weight: 900; font-style: normal; }
.hero-copy > p { max-width: 480px; color: #5f646a; font-size: 13px; line-height: 1.65; }
.hero-actions { margin-top: 18px; }
.hero-actions .primary-btn { color: #fff; border-color: var(--primary); background: var(--primary); }
.hero-actions .secondary-btn { color: #333; border-color: var(--line-strong); background: #fff; }
.hero-proof { gap: 0; margin-top: 18px; color: #6b7076; font-size: 10px; }
.hero-proof span { padding: 0 12px; border-right: 1px solid var(--line); }
.hero-proof span:first-child { padding-left: 0; }
.hero-proof span:last-child { border-right: 0; }
.hero-proof strong { color: #2f3438; font-size: 12px; }
.hero-search-stage {
  padding: 22px;
  border: 1px solid #dfe4e8;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 12px 28px rgba(23,36,43,.09);
}
.stage-index { margin-bottom: 11px; color: var(--primary-2); font-size: 10px; letter-spacing: 0; }
.hero-search-stage label { font-size: 20px; }
.hero-search-stage > p { margin: 4px 0 14px; font-size: 11px; }
.pc-home-search-box { gap: 6px; }
.pc-home-search-box input { height: 50px; border: 2px solid var(--accent); border-radius: 11px; }
.pc-home-search-box .primary-btn { min-width: 62px; border-radius: 10px; border-color: var(--primary); background: var(--primary); box-shadow: none; }
.search-examples { margin-top: 9px; }
.search-examples button { border: 0; border-radius: 6px; color: #555b61; background: #f5f7f8; }

.category-rail {
  margin: 12px 0;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}
.category-rail > span { color: #33383d; }
.category-rail button { border-radius: 8px; color: #5b6066; }
.category-rail button:hover { color: var(--primary-2); border-color: transparent; background: var(--accent-soft); }

.pc-home-actions { gap: 10px; margin: 0 0 30px; }
.pc-home-actions .entry {
  min-height: 104px;
  padding: 17px 18px;
  border-radius: 14px;
  box-shadow: none;
}
.pc-home-actions .entry::after { display: none; }
.pc-home-actions .entry.primary { color: #fff; border-color: var(--primary-2); background: linear-gradient(135deg,#168556,#0c7046); }
.entry-index { color: #62676d; }
.pc-home-actions .entry.primary .entry-index { color: #d9f6e9; }
.pc-home-actions .entry strong { margin-top: 10px; font-size: 16px; }
.pc-home-actions .entry span:not(.entry-index) { margin-top: 3px; font-size: 11px; }
.pc-home-actions .entry i { margin-top: 7px; color: var(--primary-2); font-size: 10px; }
.pc-home-actions .entry.primary i { color: #d4f7e6; }

.pc-section-heading { margin-bottom: 14px; }
.pc-section-heading h2 { font-size: clamp(24px,2.4vw,31px); }
.pc-section-heading .eyebrow { color: var(--primary-2); font-size: 10px; letter-spacing: 0; text-transform: none; }
.pc-discovery { margin: 0 0 12px; padding: 20px 24px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.pc-discovery-grid { gap: 10px; }
.service-product-card { border-radius: 13px; box-shadow: none; }
.service-product-card:hover { transform: translateY(-2px); border-color: #bfc6cc; box-shadow: var(--shadow-soft); }
.pc-product-visual {
  height: 118px;
  background: linear-gradient(135deg,#f1f7f4,#e7f4ee);
}
.pc-product-visual::before {
  left: auto;
  right: 22px;
  bottom: 18px;
  width: 62px;
  height: 62px;
  border-radius: 20px 50% 50% 50%;
  background: rgba(25,195,125,.16);
  box-shadow: none;
  transform: rotate(20deg);
}
.pc-product-visual::after { display: none; }
.pc-product-visual i { width: 30px; height: 30px; left: 20px; top: 22px; border: 8px solid rgba(25,195,125,.12); }
.pc-product-visual b { width: 16px; height: 16px; right: 74px; bottom: 18px; background: rgba(25,195,125,.24); border: 0; }
.formula-mark { color: #1d6c49; font-size: 9px; letter-spacing: .14em; }
.pc-discovery-copy { padding: 15px; }
.product-card-top { margin-bottom: 8px; }
.pc-evidence-pill { border-radius: 5px; color: #327457; background: var(--accent-soft); }
.pc-evidence-pill,.pc-fit-tags span,.rail-status,.usage-meta span,.retention-source,.role { color: #185b3c; }
.stage-index,.hero-copy .eyebrow,.service-status-strip button,.handoff-header-btn,.pc-home-actions .entry i { color: var(--primary); }
.pc-section-heading .eyebrow,.rail-candidates li > span,.mobile-curated button > span,.bridge-line,.product-reason,.why,.delta,.source-list a { color: var(--primary); }
.bridge-card.new i,.evidence-intro .eyebrow { color: #d9f6e9; }
.bridge-card.new small,.evidence-intro p { color: #edf8f3; }
.product-card-top button { border-radius: 8px; color: #fff; background: var(--primary); }
.pc-discovery-copy h3 { font-size: 16px; }
.pc-fit-tags span { border-radius: 5px; }
.product-reason,.pc-preview-caveat { border-radius: 8px; }

.service-concerns { margin-bottom: 42px; padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.pc-concern-list { gap: 8px; }
.concern-tile {
  min-height: 96px;
  padding: 15px 44px 15px 15px;
  border-radius: 12px;
  box-shadow: none;
}
.concern-tile:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); transform: none; box-shadow: none; }
.concern-tile span { margin-bottom: 10px; }
.concern-tile span,.home-usage-grid article > span,.pc-area-label,.section-kicker,.method-grid span,.service-evidence-grid article > span { color: var(--primary); }
.concern-tile:hover span,.concern-tile:hover small { color: var(--muted); }
.concern-tile strong { font-size: 15px; }
.concern-tile i { right: 14px; bottom: 14px; width: 26px; height: 26px; color: #fff; background: var(--primary); }
.service-data-notice { margin: -24px 0 38px; border-radius: 10px; }

.service-bridge-feature,.service-evidence-grid,.service-usage-showcase,.pc-workbench { margin-bottom: 44px; }
.service-bridge-feature { border-radius: 16px; box-shadow: none; }
.service-evidence-grid { gap: 8px; }
.service-evidence-grid > * { border-radius: 14px; box-shadow: none; }
.service-usage-showcase { padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.home-usage-grid { gap: 8px; }
.home-usage-grid article { border-radius: 12px; box-shadow: none; }
.pc-work-area,.pc-stat-stage { border-radius: 14px; box-shadow: none; }
.pc-stat-stage { background: #25362f; }
.service-decision-rail { top: 145px; padding: 19px; border-radius: 15px; box-shadow: var(--shadow-soft); }
.service-decision-rail h2 { font-size: 23px; }
.rail-status { border-radius: 5px; }
.service-trust-strip { border-radius: 13px; }

.service-footer {
  width: min(calc(100% - 40px),1280px);
  margin-bottom: 20px;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: #686d73;
  background: #fff;
}
.service-footer > section { padding: 24px 28px 20px; border-bottom-color: var(--line); }
.footer-brand .brand-seal { color: #fff; background: var(--primary); }
.footer-brand strong,.service-footer nav strong { color: #25292d; }
.footer-brand p,.service-footer nav button,.footer-legal p,.footer-legal span { color: #5d6268; }
.footer-principles span { color: #5a6066; border-color: var(--line); background: #f7f8f9; }
.service-footer > nav { padding: 20px 28px; }
.service-footer nav button:hover { color: var(--primary-2); }
.footer-legal { padding: 16px 28px 22px; border-top-color: var(--line); }
.storage-bar { border-radius: 11px; box-shadow: var(--shadow-soft); }

/* 내부 화면도 같은 서비스 문법을 사용한다. */
.service-section-head { max-width: 940px; margin-bottom: 24px; }
.service-section-head .back { border-radius: 10px; }
.service-section-head h1 { font-size: clamp(32px,4vw,48px); }
.form-card,.usage-controls,.usage-detail,.guide-product,.guide-phase,.decision,.alt,.card,.compare-wrap { border-radius: 14px; box-shadow: none; }
.card { padding: 18px; }
.card::before { height: 4px; margin: -18px 0 18px; border-radius: 14px 14px 0 0; }
.usage-start,.usage-card { border-radius: 13px; box-shadow: none; }
.method-hero { padding: 38px; border: 1px solid var(--line); border-radius: 16px; color: var(--text); background: #fff; }
.method-hero .eyebrow { color: var(--primary-2); }
.method-hero h2 { font-size: clamp(34px,4vw,48px); }
.method-hero > p { color: var(--muted); }
.method-grid article { min-height: 200px; border-radius: 13px; }
.method-grid h3 { margin-top: 50px; }
.method-ledger,.method-actions { border-radius: 14px; }
.method-actions { background: var(--accent-soft); }
.pc-handoff-dock { border-radius: 12px; box-shadow: var(--shadow-soft); }
.pc-shortcut-panel > div { border-radius: 18px; }

/* 개발 프롬프트의 진행 상황: 모든 경로에서 사라지지 않는 고정 상태 패널 */
.development-dashboard {
  position: fixed;
  z-index: 56;
  right: 16px;
  bottom: 18px;
  width: min(300px,calc(100vw - 32px));
  overflow: hidden;
  border: 1px solid #cfd8d2;
  border-radius: 12px;
  background: rgba(255,255,255,.97);
  box-shadow: 0 12px 32px rgba(24,39,32,.16);
  backdrop-filter: blur(12px);
}
.development-dashboard-toggle {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto auto auto;
  align-items: center;
  width: 100%;
  min-height: 42px;
  gap: 8px;
  padding: 9px 11px 7px;
  border: 0;
  color: #242a27;
  background: transparent;
  text-align: left;
}
.development-dashboard-toggle:hover { background: #f2f7f4; }
.development-dashboard-label { display: inline-flex; min-width: 0; align-items: center; gap: 6px; color: #4d5651; font-size: 11px; font-weight: 800; }
.development-dashboard-label i { width: 7px; height: 7px; border-radius: 50%; background: #19c37d; box-shadow: 0 0 0 4px rgba(25,195,125,.14); }
.development-dashboard-toggle strong { color: #2d3832; font-size: 11px; white-space: nowrap; }
.development-dashboard-toggle b { color: #0d8552; font-size: 15px; white-space: nowrap; }
.development-dashboard-chevron { color: #6c756f; font-size: 10px; white-space: nowrap; }
.development-dashboard-track { height: 4px; margin: 0 11px 10px; overflow: hidden; border-radius: 999px; background: #e4ebe7; }
