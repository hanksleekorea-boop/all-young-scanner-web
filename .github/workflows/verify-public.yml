name: Verify public service

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local release integrity
        run: npm run verify
      - name: Live HTTPS and release identity
        run: npm run verify:live
